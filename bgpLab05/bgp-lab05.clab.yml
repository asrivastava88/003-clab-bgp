# bgp-lab05 | Unnumbered eBGP underlay (RFC 8950) vs a numbered one, same fabric
# containerlab 0.79.0 | cEOS 4.36.0.1F  (every node, no exceptions)
#
# In unnumbered mode the six fabric links carry NO IPv4 address at all. eBGP
# sessions form over IPv6 link-local and carry the IPv4 loopbacks with IPv6
# next hops. The EVPN overlay is unchanged from the numbered build.
#
# Deploy one mode at a time:  ./lab.sh deploy unnumbered  (also: base, numbered)
name: bgp-lab05

mgmt:
  network: clab-bgp-lab05
  ipv4-subnet: 172.31.105.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.0.1F

  nodes:
    spine1: {kind: arista_ceos, startup-config: configs/active/spine1.cfg}
    spine2: {kind: arista_ceos, startup-config: configs/active/spine2.cfg}
    leaf1:  {kind: arista_ceos, startup-config: configs/active/leaf1.cfg}
    leaf2:  {kind: arista_ceos, startup-config: configs/active/leaf2.cfg}
    leaf3:  {kind: arista_ceos, startup-config: configs/active/leaf3.cfg}
    h1:     {kind: arista_ceos, startup-config: configs/active/h1.cfg}
    h2:     {kind: arista_ceos, startup-config: configs/active/h2.cfg}
    h3:     {kind: arista_ceos, startup-config: configs/active/h3.cfg}

  links:
    # spines: Eth1 leaf1, Eth2 leaf2, Eth3 leaf3
    # leaves: Eth1 -> spine1, Eth2 -> spine2
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    # endpoints
    - endpoints: ["leaf1:eth3", "h1:eth1"]
    - endpoints: ["leaf2:eth3", "h2:eth1"]
    - endpoints: ["leaf3:eth3", "h3:eth1"]
