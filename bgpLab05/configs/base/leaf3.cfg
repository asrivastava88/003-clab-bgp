! leaf3 | bgp-lab05 | base | generated by tools/gen_configs.py
hostname leaf3
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
! required for interface-based BGP even though no IPv6 prefix is routed
ipv6 unicast-routing
! required so IPv4 traffic can forward out an interface that has no IPv4 address
ip routing ipv6 interfaces
!
vlan 20
   name DB
!
vrf instance RED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ipv6 enable
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ipv6 enable
!
interface Ethernet3
   description HOST_h3
   switchport access vlan 20
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.13/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.13/32
!
interface Vlan20
   description DB
   vrf RED
   ip address virtual 10.10.20.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 20 vni 10020
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
end
