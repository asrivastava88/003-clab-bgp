! spine2 | bgp-lab05 | base | generated by tools/gen_configs.py
hostname spine2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
! required for interface-based BGP even though no IPv6 prefix is routed
ipv6 unicast-routing
! required so IPv4 traffic can forward out an interface that has no IPv4 address
ip routing ipv6 interfaces
!
interface Ethernet1
   description P2P_leaf1
   no switchport
   mtu 9214
   ipv6 enable
!
interface Ethernet2
   description P2P_leaf2
   no switchport
   mtu 9214
   ipv6 enable
!
interface Ethernet3
   description P2P_leaf3
   no switchport
   mtu 9214
   ipv6 enable
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.2/32
!
ip routing
!
end
