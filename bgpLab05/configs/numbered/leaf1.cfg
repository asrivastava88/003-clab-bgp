! leaf1 | bgp-lab05 | numbered | generated by tools/gen_configs.py
hostname leaf1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vlan 10
   name APP
!
vrf instance RED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.1/31
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ip address 10.1.2.1/31
!
interface Ethernet3
   description HOST_h1
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.11/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.11/32
!
interface Vlan10
   description APP
   vrf RED
   ip address virtual 10.10.10.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.0.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65101
   router-id 10.0.0.11
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor 10.1.1.0 peer group UNDERLAY
   neighbor 10.1.1.0 remote-as 65100
   neighbor 10.1.1.0 description spine1
   neighbor 10.1.2.0 peer group UNDERLAY
   neighbor 10.1.2.0 remote-as 65100
   neighbor 10.1.2.0 description spine2
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65100
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY ebgp-multihop 3
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 0
   neighbor 10.0.0.1 peer group OVERLAY
   neighbor 10.0.0.1 description spine1-evpn
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.0.0.2 description spine2-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.0.0.11:10010
      route-target both 10010:10010
      redistribute learned
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
   !
   vrf RED
      rd 10.0.0.11:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.11
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
