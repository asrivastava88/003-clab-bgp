! spine1 | bgp-lab05 | numbered | generated by tools/gen_configs.py
hostname spine1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description P2P_leaf1
   no switchport
   mtu 9214
   ip address 10.1.1.0/31
!
interface Ethernet2
   description P2P_leaf2
   no switchport
   mtu 9214
   ip address 10.1.1.2/31
!
interface Ethernet3
   description P2P_leaf3
   no switchport
   mtu 9214
   ip address 10.1.1.4/31
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.1/32
!
ip routing
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.0.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65100
   router-id 10.0.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor 10.1.1.1 peer group UNDERLAY
   neighbor 10.1.1.1 remote-as 65101
   neighbor 10.1.1.1 description leaf1
   neighbor 10.1.1.3 peer group UNDERLAY
   neighbor 10.1.1.3 remote-as 65102
   neighbor 10.1.1.3 description leaf2
   neighbor 10.1.1.5 peer group UNDERLAY
   neighbor 10.1.1.5 remote-as 65103
   neighbor 10.1.1.5 description leaf3
   neighbor OVERLAY peer group
   neighbor OVERLAY next-hop-unchanged
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY ebgp-multihop 3
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 0
   neighbor 10.0.0.11 peer group OVERLAY
   neighbor 10.0.0.11 remote-as 65101
   neighbor 10.0.0.11 description leaf1-evpn
   neighbor 10.0.0.12 peer group OVERLAY
   neighbor 10.0.0.12 remote-as 65102
   neighbor 10.0.0.12 description leaf2-evpn
   neighbor 10.0.0.13 peer group OVERLAY
   neighbor 10.0.0.13 remote-as 65103
   neighbor 10.0.0.13 description leaf3-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
!
end
