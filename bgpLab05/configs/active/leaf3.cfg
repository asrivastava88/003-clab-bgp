! leaf3 | bgp-lab05 | unnumbered | generated by tools/gen_configs.py
hostname leaf3
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
! required for interface-based BGP even though no IPv6 prefix is routed
ipv6 unicast-routing
! required so IPv4 traffic can forward out an interface that has no IPv4 address
ip routing ipv6 interfaces
!
vlan 20
   name DB
!
vrf instance RED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ipv6 enable
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ipv6 enable
!
interface Ethernet3
   description HOST_h3
   switchport access vlan 20
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.13/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.13/32
!
interface Vlan20
   description DB
   vrf RED
   ip address virtual 10.10.20.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 20 vni 10020
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.0.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65103
   router-id 10.0.0.13
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor interface Et1-2 peer-group UNDERLAY remote-as 65100
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65100
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY ebgp-multihop 3
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 0
   neighbor 10.0.0.1 peer group OVERLAY
   neighbor 10.0.0.1 description spine1-evpn
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.0.0.2 description spine2-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 20
      rd 10.0.0.13:10020
      route-target both 10020:10020
      redistribute learned
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
      ! advertise IPv4 NLRI with an IPv6 link-local next hop (RFC 8950)
      neighbor UNDERLAY next-hop address-family ipv6 originate
   !
   vrf RED
      rd 10.0.0.13:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.13
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
