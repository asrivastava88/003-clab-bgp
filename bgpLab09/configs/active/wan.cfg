! wan | bgp-lab09 | provider-managed | generated by tools/gen_configs.py
hostname wan
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description CUST_bleaf1
   no switchport
   ip address 172.16.1.2/30
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet2
   description CUST_bleaf2
   no switchport
   ip address 172.16.2.2/30
   bfd interval 300 min-rx 300 multiplier 3
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Loopback1
   description internet test target
   ip address 203.0.113.10/32
!
ip routing
!
ip route 203.0.113.0/24 Null0
!
router bgp 65200
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor 172.16.1.1 remote-as 65104
   neighbor 172.16.1.1 description bleaf1
   neighbor 172.16.1.1 default-originate
   neighbor 172.16.1.1 bfd
   neighbor 172.16.1.1 timers 3 9
   neighbor 172.16.1.1 maximum-routes 1000
   neighbor 172.16.2.1 remote-as 65105
   neighbor 172.16.2.1 description bleaf2
   neighbor 172.16.2.1 default-originate
   neighbor 172.16.2.1 bfd
   neighbor 172.16.2.1 timers 3 9
   neighbor 172.16.2.1 maximum-routes 1000
   network 203.0.113.0/24
   !
   address-family ipv4
      neighbor 172.16.1.1 activate
      neighbor 172.16.2.1 activate
!
end
