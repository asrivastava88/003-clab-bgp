! leafB | bgp-lab08 | base | generated by tools/gen_configs.py
hostname leafB
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vlan 10
   name STRETCH
!
vlan 30
   name B_LOCAL
!
vrf instance RED
!
interface Ethernet1
   description P2P_spineB
   no switchport
   mtu 9214
   ip address 10.2.1.1/31
!
interface Ethernet3
   description HOST_hB1
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Ethernet4
   description HOST_hB2
   switchport access vlan 30
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_EVPN
   ip address 10.0.2.11/32
!
interface Loopback1
   description VTEP
   ip address 10.0.3.11/32
!
interface Vlan10
   description STRETCH
   vrf RED
   ip address virtual 10.10.10.1/24
!
interface Vlan30
   description B_LOCAL
   vrf RED
   ip address virtual 10.30.30.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 30 vni 10030
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
ip prefix-list PL-SITE-LOOPBACKS seq 10 permit 10.0.2.0/24 eq 32
ip prefix-list PL-SITE-LOOPBACKS seq 20 permit 10.0.3.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-SITE-LOOPBACKS
!
router bgp 65201
   router-id 10.0.2.11
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65200
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN remote-as 65200
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor EVPN maximum-routes 0
   neighbor 10.2.1.0 peer group UNDERLAY
   neighbor 10.2.1.0 description spineB
   neighbor 10.0.2.1 peer group EVPN
   neighbor 10.0.2.1 description spineB-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.0.2.11:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 30
      rd 10.0.2.11:10030
      route-target both 10030:10030
      redistribute learned
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
   !
   vrf RED
      rd 10.0.2.11:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.2.11
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
