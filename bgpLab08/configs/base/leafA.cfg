! leafA | bgp-lab08 | base | generated by tools/gen_configs.py
hostname leafA
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vlan 10
   name STRETCH
!
vlan 20
   name A_LOCAL
!
vrf instance RED
!
interface Ethernet1
   description P2P_spineA
   no switchport
   mtu 9214
   ip address 10.1.1.1/31
!
interface Ethernet3
   description HOST_hA1
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Ethernet4
   description HOST_hA2
   switchport access vlan 20
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_EVPN
   ip address 10.0.0.11/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.11/32
!
interface Vlan10
   description STRETCH
   vrf RED
   ip address virtual 10.10.10.1/24
!
interface Vlan20
   description A_LOCAL
   vrf RED
   ip address virtual 10.20.20.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
ip prefix-list PL-SITE-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-SITE-LOOPBACKS seq 20 permit 10.0.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-SITE-LOOPBACKS
!
router bgp 65101
   router-id 10.0.0.11
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65100
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN remote-as 65100
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor EVPN maximum-routes 0
   neighbor 10.1.1.0 peer group UNDERLAY
   neighbor 10.1.1.0 description spineA
   neighbor 10.0.0.1 peer group EVPN
   neighbor 10.0.0.1 description spineA-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.0.0.11:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.0.0.11:10020
      route-target both 10020:10020
      redistribute learned
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
   !
   vrf RED
      rd 10.0.0.11:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.11
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
