! spineB | bgp-lab08 | base | generated by tools/gen_configs.py
hostname spineB
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description P2P_leafB
   no switchport
   mtu 9214
   ip address 10.2.1.0/31
!
interface Ethernet2
   description P2P_bgwB
   no switchport
   mtu 9214
   ip address 10.2.1.2/31
!
interface Loopback0
   ip address 10.0.2.1/32
!
ip routing
!
ip prefix-list PL-SITE-LOOPBACKS seq 10 permit 10.0.2.0/24 eq 32
ip prefix-list PL-SITE-LOOPBACKS seq 20 permit 10.0.3.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-SITE-LOOPBACKS
!
router bgp 65200
   router-id 10.0.2.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN next-hop-unchanged
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor EVPN maximum-routes 0
   neighbor 10.2.1.1 peer group UNDERLAY
   neighbor 10.2.1.1 remote-as 65201
   neighbor 10.2.1.1 description leafB
   neighbor 10.2.1.3 peer group UNDERLAY
   neighbor 10.2.1.3 remote-as 65204
   neighbor 10.2.1.3 description bgwB
   neighbor 10.0.2.11 peer group EVPN
   neighbor 10.0.2.11 remote-as 65201
   neighbor 10.0.2.11 description leafB-evpn
   neighbor 10.0.2.14 peer group EVPN
   neighbor 10.0.2.14 remote-as 65204
   neighbor 10.0.2.14 description bgwB-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
!
end
