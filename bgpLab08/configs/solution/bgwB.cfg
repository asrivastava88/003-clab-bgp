! bgwB | bgp-lab08 | solution | generated by tools/gen_configs.py
hostname bgwB
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vlan 10
   name STRETCH
!
vrf instance RED
!
interface Ethernet1
   description P2P_spineB
   no switchport
   mtu 9214
   ip address 10.2.1.3/31
!
interface Ethernet3
   description DCI_bgwA
   no switchport
   mtu 9214
   ip address 172.16.0.2/30
!
interface Loopback0
   description ROUTER_ID_EVPN_AND_VTEP
   ip address 10.0.2.14/32
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vrf RED vni 50001
!
ip routing
ip routing vrf RED
!
ip prefix-list PL-SITE-LOOPBACKS seq 10 permit 10.0.2.0/24 eq 32
ip prefix-list PL-SITE-LOOPBACKS seq 20 permit 10.0.3.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-SITE-LOOPBACKS
!
ip prefix-list PL-DCI-OUT seq 10 permit 10.0.2.14/32
!
ip prefix-list PL-DCI-IN seq 10 permit 10.0.0.14/32
!
route-map RM-DCI-OUT permit 10
   description only this gateway's own loopback crosses the DCI
   match ip address prefix-list PL-DCI-OUT
!
route-map RM-DCI-IN permit 10
   description only the far gateway's loopback enters this site
   match ip address prefix-list PL-DCI-IN
!
route-map RM-SITE-OUT permit 10
   description keep DCI-learned prefixes out of our own underlay
   match ip address prefix-list PL-SITE-LOOPBACKS
!
router bgp 65204
   router-id 10.0.2.14
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65200
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN remote-as 65200
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor EVPN maximum-routes 0
   ! site-facing half of the gateway: our leaves tunnel to us,
   ! never to a VTEP in the other site
   neighbor EVPN next-hop-self
   neighbor 10.2.1.2 peer group UNDERLAY
   neighbor 10.2.1.2 description spineB
   neighbor 10.2.1.2 route-map RM-SITE-OUT out
   neighbor 10.0.2.1 peer group EVPN
   neighbor 10.0.2.1 description spineB-evpn
   !
   ! DCI underlay: exchange the two gateway loopbacks and nothing else
   neighbor 172.16.0.1 remote-as 65104
   neighbor 172.16.0.1 description bgwA-dci-underlay
   neighbor 172.16.0.1 route-map RM-DCI-IN in
   neighbor 172.16.0.1 route-map RM-DCI-OUT out
   neighbor 172.16.0.1 maximum-routes 100
   !
   ! DCI overlay: EVPN between the gateways, Loopback0 to Loopback0.
   ! next-hop-self is what makes this a gateway rather than a flat stretch:
   ! the far site tunnels to US, not to our leaves.
   neighbor DCI-EVPN peer group
   neighbor DCI-EVPN remote-as 65104
   neighbor DCI-EVPN update-source Loopback0
   neighbor DCI-EVPN ebgp-multihop 3
   neighbor DCI-EVPN next-hop-self
   neighbor DCI-EVPN send-community extended
   neighbor DCI-EVPN maximum-routes 0
   neighbor 10.0.0.14 peer group DCI-EVPN
   neighbor 10.0.0.14 description bgwA-dci-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.0.2.14:10010
      route-target both 10010:10010
      redistribute learned
   !
   address-family evpn
      neighbor EVPN activate
      neighbor DCI-EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
      neighbor 172.16.0.1 activate
   !
   vrf RED
      rd 10.0.2.14:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.2.14
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
