! leaf2 | bgp-lab04 | addpath | generated by tools/gen_configs.py
hostname leaf2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vlan 10
   name APP
!
vlan 20
   name DB
!
vrf instance RED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.3/31
   ip ospf network point-to-point
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ip address 10.1.2.3/31
   ip ospf network point-to-point
!
interface Ethernet3
   description HOST_h2
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Ethernet4
   description HOST_h3
   switchport access vlan 20
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.12/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.12/32
!
interface Vlan10
   description APP
   vrf RED
   ip address virtual 10.10.10.1/24
!
interface Vlan20
   description DB
   vrf RED
   ip address virtual 10.10.20.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
router ospf 1
   router-id 10.0.0.12
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.0.0.0/16 area 0.0.0.0
   network 10.1.0.0/16 area 0.0.0.0
   max-lsa 12000
!
router bgp 65000
   router-id 10.0.0.12
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65000
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 0
   neighbor 10.0.0.1 peer group OVERLAY
   neighbor 10.0.0.1 description spine1-rr
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.0.0.2 description spine2-rr
   !
   vlan 10
      rd 10.0.0.12:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.0.0.12:10020
      route-target both 10020:10020
      redistribute learned
   !
   address-family evpn
      neighbor OVERLAY activate
      bgp additional-paths receive
   !
   vrf RED
      rd 10.0.0.12:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.12
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
