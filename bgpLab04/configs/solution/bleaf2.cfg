! bleaf2 | bgp-lab04 | solution | generated by tools/gen_configs.py
hostname bleaf2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vrf instance RED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.7/31
   ip ospf network point-to-point
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ip address 10.1.2.7/31
   ip ospf network point-to-point
!
interface Ethernet3
   description WAN_vrf_RED
   no switchport
   vrf RED
   ip address 172.16.2.1/30
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.15/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.15/32
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
router ospf 1
   router-id 10.0.0.15
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.0.0.0/16 area 0.0.0.0
   network 10.1.0.0/16 area 0.0.0.0
   max-lsa 12000
!
ip prefix-list PL-FROM-WAN seq 10 permit 0.0.0.0/0
ip prefix-list PL-FROM-WAN seq 20 permit 203.0.113.0/24
ip prefix-list PL-TENANT seq 10 permit 10.10.0.0/16 le 24
!
route-map RM-WAN-IN permit 10
   match ip address prefix-list PL-FROM-WAN
!
route-map RM-WAN-OUT permit 10
   match ip address prefix-list PL-TENANT
!
router bgp 65000
   router-id 10.0.0.15
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65000
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 0
   neighbor 10.0.0.1 peer group OVERLAY
   neighbor 10.0.0.1 description spine1-rr
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.0.0.2 description spine2-rr
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   vrf RED
      rd 10.0.0.15:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.15
      maximum-paths 4 ecmp 4
      neighbor 172.16.2.2 remote-as 65100
      neighbor 172.16.2.2 description wan
      neighbor 172.16.2.2 route-map RM-WAN-IN in
      neighbor 172.16.2.2 route-map RM-WAN-OUT out
      neighbor 172.16.2.2 maximum-routes 1000
      redistribute connected
      !
      address-family ipv4
         neighbor 172.16.2.2 activate
   !
!
end
