! leaf1 | bgp-lab04 | solution | generated by tools/gen_configs.py
hostname leaf1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vlan 10
   name APP
!
vrf instance RED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.1/31
   ip ospf network point-to-point
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ip address 10.1.2.1/31
   ip ospf network point-to-point
!
interface Ethernet3
   description HOST_h1
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.11/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.11/32
!
interface Vlan10
   description APP
   vrf RED
   ip address virtual 10.10.10.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
router ospf 1
   router-id 10.0.0.11
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.0.0.0/16 area 0.0.0.0
   network 10.1.0.0/16 area 0.0.0.0
   max-lsa 12000
!
router bgp 65000
   router-id 10.0.0.11
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65000
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 0
   neighbor 10.0.0.1 peer group OVERLAY
   neighbor 10.0.0.1 description spine1-rr
   neighbor 10.0.0.2 peer group OVERLAY
   neighbor 10.0.0.2 description spine2-rr
   !
   vlan 10
      rd 10.0.0.11:10010
      route-target both 10010:10010
      redistribute learned
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   vrf RED
      rd 10.0.0.11:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.11
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
