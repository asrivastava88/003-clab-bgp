! wan | bgp-lab04 | provider-managed | generated by tools/gen_configs.py
hostname wan
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description CUST_bleaf1
   no switchport
   ip address 172.16.1.2/30
!
interface Ethernet2
   description CUST_bleaf2
   no switchport
   ip address 172.16.2.2/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.1/32
!
interface Loopback1
   description internet test target
   ip address 203.0.113.10/32
!
ip routing
!
! pull 203.0.113.0/24 into the table so BGP can originate it
ip route 203.0.113.0/24 Null0
!
ip prefix-list PL-TO-CUST seq 10 permit 0.0.0.0/0
ip prefix-list PL-TO-CUST seq 20 permit 203.0.113.0/24
ip prefix-list PL-FROM-CUST seq 10 permit 10.10.0.0/16 le 24
!
route-map RM-CUST-IN permit 10
   match ip address prefix-list PL-FROM-CUST
!
route-map RM-CUST-OUT permit 10
   match ip address prefix-list PL-TO-CUST
!
router bgp 65100
   router-id 10.255.0.1
   maximum-paths 4 ecmp 4
   neighbor CUSTOMER peer group
   neighbor CUSTOMER remote-as 65000
   neighbor CUSTOMER route-map RM-CUST-IN in
   neighbor CUSTOMER route-map RM-CUST-OUT out
   neighbor CUSTOMER default-originate
   neighbor CUSTOMER maximum-routes 100
   neighbor 172.16.1.1 peer group CUSTOMER
   neighbor 172.16.1.1 description bleaf1
   neighbor 172.16.2.1 peer group CUSTOMER
   neighbor 172.16.2.1 description bleaf2
   network 203.0.113.0/24
!
end
