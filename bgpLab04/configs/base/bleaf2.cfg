! bleaf2 | bgp-lab04 | base | generated by tools/gen_configs.py
hostname bleaf2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vrf instance RED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.7/31
   ip ospf network point-to-point
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ip address 10.1.2.7/31
   ip ospf network point-to-point
!
interface Ethernet3
   description WAN_vrf_RED
   no switchport
   vrf RED
   ip address 172.16.2.1/30
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.15/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.15/32
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf RED vni 50001
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
!
router ospf 1
   router-id 10.0.0.15
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.0.0.0/16 area 0.0.0.0
   network 10.1.0.0/16 area 0.0.0.0
   max-lsa 12000
!
end
