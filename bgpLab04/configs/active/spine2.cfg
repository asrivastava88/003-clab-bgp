! spine2 | bgp-lab04 | addpath | generated by tools/gen_configs.py
hostname spine2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description P2P_leaf1
   no switchport
   mtu 9214
   ip address 10.1.2.0/31
   ip ospf network point-to-point
!
interface Ethernet2
   description P2P_leaf2
   no switchport
   mtu 9214
   ip address 10.1.2.2/31
   ip ospf network point-to-point
!
interface Ethernet3
   description P2P_bleaf1
   no switchport
   mtu 9214
   ip address 10.1.2.4/31
   ip ospf network point-to-point
!
interface Ethernet4
   description P2P_bleaf2
   no switchport
   mtu 9214
   ip address 10.1.2.6/31
   ip ospf network point-to-point
!
interface Loopback0
   description ROUTER_ID_AND_OVERLAY_PEERING
   ip address 10.0.0.2/32
!
ip routing
!
router ospf 1
   router-id 10.0.0.2
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   no passive-interface Ethernet3
   no passive-interface Ethernet4
   network 10.0.0.0/16 area 0.0.0.0
   network 10.1.0.0/16 area 0.0.0.0
   max-lsa 12000
!
router bgp 65000
   router-id 10.0.0.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65000
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY route-reflector-client
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 0
   neighbor 10.0.0.11 peer group OVERLAY
   neighbor 10.0.0.11 description leaf1
   neighbor 10.0.0.12 peer group OVERLAY
   neighbor 10.0.0.12 description leaf2
   neighbor 10.0.0.14 peer group OVERLAY
   neighbor 10.0.0.14 description bleaf1
   neighbor 10.0.0.15 peer group OVERLAY
   neighbor 10.0.0.15 description bleaf2
   !
   address-family evpn
      neighbor OVERLAY activate
      ! without these the reflector advertises one best path per
      ! prefix and the second border leaf is invisible to clients
      bgp additional-paths send any
      bgp additional-paths receive
!
end
