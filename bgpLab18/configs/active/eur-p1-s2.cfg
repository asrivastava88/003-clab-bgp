! eur-p1-s2 | bgp-lab18 | spine, pod 1, London | AS 65301 | generated by tools/gen_configs.py
hostname eur-p1-s2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description LEAF_eur-p1-l1_link50
   no switchport
   mtu 9214
   ip address 10.254.0.101/31
!
interface Ethernet2
   description LEAF_eur-p1-l2_link52
   no switchport
   mtu 9214
   ip address 10.254.0.105/31
!
interface Ethernet3
   description SUPERSPINE_eur-ss1_link43
   no switchport
   mtu 9214
   ip address 10.254.0.86/31
!
interface Ethernet4
   description SUPERSPINE_eur-ss2_link44
   no switchport
   mtu 9214
   ip address 10.254.0.88/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.3.12/32
!
ip routing
!
ip route 10.13.0.0/17 Null0 254
!
ip prefix-list PL-POD-UP seq 10 permit 10.13.0.0/17
ip prefix-list PL-POD-UP seq 20 permit 10.0.3.11/32
ip prefix-list PL-POD-UP seq 30 permit 10.0.3.12/32
ip prefix-list PL-POD-UP seq 40 permit 10.0.3.31/32
ip prefix-list PL-POD-UP seq 50 permit 10.0.3.32/32
ip prefix-list PL-POD-UP seq 60 permit 10.100.0.0/24
!
route-map RM-SPINE-UP permit 10
   description northbound: one aggregate per pod, pod loopbacks, anycast
   match ip address prefix-list PL-POD-UP
!
route-map RM-SPINE-DOWN permit 10
   description southbound: all we know
!
router bgp 65301
   router-id 10.0.3.12
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   bgp log-neighbor-changes
   neighbor LEAF-65311 peer group
   neighbor LEAF-65311 remote-as 65311
   neighbor LEAF-65311 send-community
   neighbor LEAF-65311 route-map RM-SPINE-DOWN out
   neighbor LEAF-65311 maximum-routes 12000
   neighbor 10.254.0.100 peer group LEAF-65311
   neighbor 10.254.0.100 description eur-p1-l1
   neighbor LEAF-65312 peer group
   neighbor LEAF-65312 remote-as 65312
   neighbor LEAF-65312 send-community
   neighbor LEAF-65312 route-map RM-SPINE-DOWN out
   neighbor LEAF-65312 maximum-routes 12000
   neighbor 10.254.0.104 peer group LEAF-65312
   neighbor 10.254.0.104 description eur-p1-l2
   neighbor SUPERSPINE-65300 peer group
   neighbor SUPERSPINE-65300 remote-as 65300
   neighbor SUPERSPINE-65300 send-community
   neighbor SUPERSPINE-65300 route-map RM-SPINE-UP out
   neighbor SUPERSPINE-65300 maximum-routes 12000
   neighbor 10.254.0.87 peer group SUPERSPINE-65300
   neighbor 10.254.0.87 description eur-ss1
   neighbor 10.254.0.89 peer group SUPERSPINE-65300
   neighbor 10.254.0.89 description eur-ss2
   !
   address-family ipv4
      neighbor LEAF-65311 activate
      neighbor LEAF-65312 activate
      neighbor SUPERSPINE-65300 activate
      network 10.0.3.12/32
      network 10.13.0.0/17
!
end
