! wst-p1-l2 | bgp-lab18 | leaf, pod 1, Seattle | AS 65112 | generated by tools/gen_configs.py
hostname wst-p1-l2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description SPINE_wst-p1-s1_link11
   no switchport
   mtu 9214
   ip address 10.254.0.22/31
!
interface Ethernet2
   description SPINE_wst-p1-s2_link12
   no switchport
   mtu 9214
   ip address 10.254.0.24/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.1.32/32
!
interface Loopback1
   description HOST_10.11.5.0/24
   ip address 10.11.5.1/32
!
interface Loopback2
   description HOST_10.11.6.0/24
   ip address 10.11.6.1/32
!
interface Loopback3
   description HOST_10.11.7.0/24
   ip address 10.11.7.1/32
!
interface Loopback4
   description HOST_10.11.8.0/24
   ip address 10.11.8.1/32
!
ip routing
!
ip route 10.11.5.0/24 Null0 254
ip route 10.11.6.0/24 Null0 254
ip route 10.11.7.0/24 Null0 254
ip route 10.11.8.0/24 Null0 254
!
ip prefix-list PL-OWN seq 10 permit 10.0.1.32/32
ip prefix-list PL-OWN seq 20 permit 10.11.5.0/24
ip prefix-list PL-OWN seq 30 permit 10.11.6.0/24
ip prefix-list PL-OWN seq 40 permit 10.11.7.0/24
ip prefix-list PL-OWN seq 50 permit 10.11.8.0/24
!
route-map RM-LEAF-OUT permit 10
   description a leaf announces its own space and nothing else
   match ip address prefix-list PL-OWN
!
router bgp 65112
   router-id 10.0.1.32
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   bgp log-neighbor-changes
   neighbor SPINE-65101 peer group
   neighbor SPINE-65101 remote-as 65101
   neighbor SPINE-65101 send-community
   neighbor SPINE-65101 route-map RM-LEAF-OUT out
   neighbor SPINE-65101 maximum-routes 12000
   neighbor 10.254.0.23 peer group SPINE-65101
   neighbor 10.254.0.23 description wst-p1-s1
   neighbor 10.254.0.25 peer group SPINE-65101
   neighbor 10.254.0.25 description wst-p1-s2
   !
   address-family ipv4
      neighbor SPINE-65101 activate
      network 10.0.1.32/32
      network 10.11.5.0/24
      network 10.11.6.0/24
      network 10.11.7.0/24
      network 10.11.8.0/24
!
end
