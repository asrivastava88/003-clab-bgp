! eur-b2 | bgp-lab18 | region border, London | AS 65309 | generated by tools/gen_configs.py
hostname eur-b2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description SUPERSPINE_eur-ss1_link59
   no switchport
   mtu 9214
   ip address 10.254.0.118/31
!
interface Ethernet2
   description SUPERSPINE_eur-ss2_link60
   no switchport
   mtu 9214
   ip address 10.254.0.120/31
!
interface Ethernet3
   description CARRIER_wan1_link71
   no switchport
   mtu 9214
   ip address 10.254.0.142/31
!
interface Ethernet4
   description CARRIER_wan2_link72
   no switchport
   mtu 9214
   ip address 10.254.0.144/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.3.52/32
!
ip routing
!
ip route 10.13.0.0/16 Null0 254
!
ip prefix-list PL-REGION-OUT seq 10 permit 10.13.0.0/16
ip prefix-list PL-REGION-OUT seq 20 permit 10.100.0.0/24
!
ip prefix-list PL-OUR-REGION seq 10 permit 10.13.0.0/16 le 32
!
route-map RM-WAN-OUT permit 10
   description our region and anycast only, never what a carrier told us
   match ip address prefix-list PL-REGION-OUT
!
route-map RM-WAN-IN deny 5
   description never accept our own region's space back from a carrier
   match ip address prefix-list PL-OUR-REGION
!
route-map RM-WAN-IN permit 10
   set local-preference 100
!
route-map RM-FABRIC-OUT permit 10
   description southbound into the fabric
!
router bgp 65309
   router-id 10.0.3.52
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   bgp log-neighbor-changes
   neighbor CARRIER-65500 peer group
   neighbor CARRIER-65500 remote-as 65500
   neighbor CARRIER-65500 send-community
   neighbor CARRIER-65500 route-map RM-WAN-OUT out
   neighbor CARRIER-65500 route-map RM-WAN-IN in
   neighbor CARRIER-65500 maximum-routes 12000
   neighbor 10.254.0.143 peer group CARRIER-65500
   neighbor 10.254.0.143 description wan1
   neighbor CARRIER-65600 peer group
   neighbor CARRIER-65600 remote-as 65600
   neighbor CARRIER-65600 send-community
   neighbor CARRIER-65600 route-map RM-WAN-OUT out
   neighbor CARRIER-65600 route-map RM-WAN-IN in
   neighbor CARRIER-65600 maximum-routes 12000
   neighbor 10.254.0.145 peer group CARRIER-65600
   neighbor 10.254.0.145 description wan2
   neighbor SUPERSPINE-65300 peer group
   neighbor SUPERSPINE-65300 remote-as 65300
   neighbor SUPERSPINE-65300 send-community
   neighbor SUPERSPINE-65300 route-map RM-FABRIC-OUT out
   neighbor SUPERSPINE-65300 maximum-routes 12000
   neighbor 10.254.0.119 peer group SUPERSPINE-65300
   neighbor 10.254.0.119 description eur-ss1
   neighbor 10.254.0.121 peer group SUPERSPINE-65300
   neighbor 10.254.0.121 description eur-ss2
   !
   address-family ipv4
      neighbor CARRIER-65500 activate
      neighbor CARRIER-65600 activate
      neighbor SUPERSPINE-65300 activate
      network 10.0.3.52/32
      network 10.13.0.0/16
!
end
