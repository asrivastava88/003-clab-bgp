   neighbor 10.254.0.18 description wst-p1-l1
   neighbor LEAF-65112 peer group
   neighbor LEAF-65112 remote-as 65112
   neighbor LEAF-65112 send-community
   neighbor LEAF-65112 route-map RM-SPINE-DOWN out
   neighbor LEAF-65112 maximum-routes 12000
   neighbor 10.254.0.22 peer group LEAF-65112
   neighbor 10.254.0.22 description wst-p1-l2
   neighbor SUPERSPINE-65100 peer group
   neighbor SUPERSPINE-65100 remote-as 65100
   neighbor SUPERSPINE-65100 send-community
   neighbor SUPERSPINE-65100 route-map RM-SPINE-UP out
   neighbor SUPERSPINE-65100 maximum-routes 12000
   neighbor 10.254.0.3 peer group SUPERSPINE-65100
   neighbor 10.254.0.3 description wst-ss1
   neighbor 10.254.0.5 peer group SUPERSPINE-65100
   neighbor 10.254.0.5 description wst-ss2
   !
