! wst-p1-s1 | bgp-lab18 | spine, pod 1, Seattle | AS 65101 | generated by tools/gen_configs.py
hostname wst-p1-s1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description LEAF_wst-p1-l1_link9
   no switchport
   mtu 9214
   ip address 10.254.0.19/31
!
interface Ethernet2
   description LEAF_wst-p1-l2_link11
   no switchport
   mtu 9214
   ip address 10.254.0.23/31
!
interface Ethernet3
   description SUPERSPINE_wst-ss1_link1
   no switchport
   mtu 9214
   ip address 10.254.0.2/31
!
interface Ethernet4
   description SUPERSPINE_wst-ss2_link2
   no switchport
   mtu 9214
   ip address 10.254.0.4/31
!
