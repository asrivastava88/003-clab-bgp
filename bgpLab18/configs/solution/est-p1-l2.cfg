   description SPINE_est-p1-s1_link31
   no switchport
   mtu 9214
   ip address 10.254.0.62/31
!
interface Ethernet2
   description SPINE_est-p1-s2_link32
   no switchport
   mtu 9214
   ip address 10.254.0.64/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.2.32/32
!
interface Loopback1
   description HOST_10.12.5.0/24
   ip address 10.12.5.1/32
!
interface Loopback2
   description HOST_10.12.6.0/24
   ip address 10.12.6.1/32
!
interface Loopback3
   description HOST_10.12.7.0/24
   ip address 10.12.7.1/32
!
interface Loopback4
   description HOST_10.12.8.0/24
   ip address 10.12.8.1/32
!
ip routing
!
ip route 10.12.5.0/24 Null0 254
ip route 10.12.6.0/24 Null0 254
ip route 10.12.7.0/24 Null0 254
ip route 10.12.8.0/24 Null0 254
