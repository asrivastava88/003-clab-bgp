! wst-b1 | bgp-lab18 | region border, Seattle | AS 65109 | generated by tools/gen_configs.py
hostname wst-b1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description CARRIER_wan1_link61
   no switchport
   mtu 9214
   ip address 10.254.0.122/31
!
interface Ethernet2
   description CARRIER_wan2_link62
   no switchport
   mtu 9214
   ip address 10.254.0.124/31
!
interface Ethernet3
   description SUPERSPINE_wst-ss1_link17
   no switchport
   mtu 9214
   ip address 10.254.0.34/31
!
interface Ethernet4
   description SUPERSPINE_wst-ss2_link18
   no switchport
   mtu 9214
   ip address 10.254.0.36/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.1.51/32
!
ip routing
!
ip route 10.11.0.0/16 Null0 254
!
ip prefix-list PL-REGION-OUT seq 10 permit 10.11.0.0/16
ip prefix-list PL-REGION-OUT seq 20 permit 10.100.0.0/24
!
ip prefix-list PL-OUR-REGION seq 10 permit 10.11.0.0/16 le 32
!
route-map RM-WAN-OUT permit 10
   description our region and anycast only, never what a carrier told us
   match ip address prefix-list PL-REGION-OUT
!
route-map RM-WAN-IN deny 5
   description never accept our own region's space back from a carrier
   match ip address prefix-list PL-OUR-REGION
!
route-map RM-WAN-IN permit 10
   set local-preference 100
!
route-map RM-FABRIC-OUT permit 10
   description southbound into the fabric
!
router bgp 65109
   router-id 10.0.1.51
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   bgp log-neighbor-changes
   neighbor CARRIER-65500 peer group
   neighbor CARRIER-65500 remote-as 65500
   neighbor CARRIER-65500 send-community
   neighbor CARRIER-65500 route-map RM-WAN-OUT out
   neighbor CARRIER-65500 route-map RM-WAN-IN in
   neighbor CARRIER-65500 maximum-routes 12000
   neighbor 10.254.0.123 peer group CARRIER-65500
   neighbor 10.254.0.123 description wan1
   neighbor CARRIER-65600 peer group
   neighbor CARRIER-65600 remote-as 65600
   neighbor CARRIER-65600 send-community
   neighbor CARRIER-65600 route-map RM-WAN-OUT out
   neighbor CARRIER-65600 route-map RM-WAN-IN in
   neighbor CARRIER-65600 maximum-routes 12000
   neighbor 10.254.0.125 peer group CARRIER-65600
   neighbor 10.254.0.125 description wan2
   neighbor SUPERSPINE-65100 peer group
   neighbor SUPERSPINE-65100 remote-as 65100
   neighbor SUPERSPINE-65100 send-community
   neighbor SUPERSPINE-65100 route-map RM-FABRIC-OUT out
   neighbor SUPERSPINE-65100 maximum-routes 12000
   neighbor 10.254.0.35 peer group SUPERSPINE-65100
   neighbor 10.254.0.35 description wst-ss1
   neighbor 10.254.0.37 peer group SUPERSPINE-65100
   neighbor 10.254.0.37 description wst-ss2
   !
   address-family ipv4
      neighbor CARRIER-65500 activate
      neighbor CARRIER-65600 activate
      neighbor SUPERSPINE-65100 activate
      network 10.0.1.51/32
      network 10.11.0.0/16
!
end
