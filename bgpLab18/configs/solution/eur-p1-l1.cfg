   description ROUTER_ID
   ip address 10.0.3.31/32
!
interface Loopback1
   description HOST_10.13.1.0/24
   ip address 10.13.1.1/32
!
interface Loopback2
   description HOST_10.13.2.0/24
   ip address 10.13.2.1/32
!
interface Loopback3
   description HOST_10.13.3.0/24
   ip address 10.13.3.1/32
!
