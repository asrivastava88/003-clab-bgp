! far | bgp-lab06 | external-permissive | generated by tools/gen_configs.py
hostname far
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description EBGP_transitA_AS65200
   no switchport
   ip address 172.16.26.2/30
!
interface Ethernet2
   description EBGP_transitB_AS65300
   no switchport
   ip address 172.16.36.2/30
!
interface Ethernet3
   description EBGP_peerX_AS65400
   no switchport
   ip address 172.16.46.2/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.600.1/32
!
interface Loopback1
   description ORIGINATES_10.6.0.1/16
   ip address 10.6.0.1/16
!
ip routing
!
router bgp 65600
   router-id 10.255.600.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor 172.16.26.1 remote-as 65200
   neighbor 172.16.26.1 description transitA
   neighbor 172.16.26.1 send-community
   neighbor 172.16.26.1 maximum-routes 12000
   neighbor 172.16.36.1 remote-as 65300
   neighbor 172.16.36.1 description transitB
   neighbor 172.16.36.1 send-community
   neighbor 172.16.36.1 maximum-routes 12000
   neighbor 172.16.46.1 remote-as 65400
   neighbor 172.16.46.1 description peerX
   neighbor 172.16.46.1 send-community
   neighbor 172.16.46.1 maximum-routes 12000
   network 10.6.0.0/16
   !
   address-family ipv4
      neighbor 172.16.26.1 activate
      neighbor 172.16.36.1 activate
      neighbor 172.16.46.1 activate
!
end
