! peerX | bgp-lab06 | external-permissive | generated by tools/gen_configs.py
hostname peerX
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description EBGP_edge1_AS65100
   no switchport
   ip address 172.16.14.2/30
!
interface Ethernet2
   description EBGP_far_AS65600
   no switchport
   ip address 172.16.46.1/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.400.1/32
!
interface Loopback1
   description ORIGINATES_10.202.0.1/16
   ip address 10.202.0.1/16
!
ip routing
!
router bgp 65400
   router-id 10.255.400.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor 172.16.14.1 remote-as 65100
   neighbor 172.16.14.1 description edge1
   neighbor 172.16.14.1 send-community
   neighbor 172.16.14.1 maximum-routes 12000
   neighbor 172.16.46.2 remote-as 65600
   neighbor 172.16.46.2 description far
   neighbor 172.16.46.2 send-community
   neighbor 172.16.46.2 maximum-routes 12000
   network 10.202.0.0/16
   !
   address-family ipv4
      neighbor 172.16.14.1 activate
      neighbor 172.16.46.2 activate
!
end
