! core | bgp-lab06 | solution | generated by tools/gen_configs.py
hostname core
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description IGP_edge1
   no switchport
   mtu 9214
   ip address 10.100.255.0/31
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet2
   description IGP_edge2
   no switchport
   mtu 9214
   ip address 10.100.255.2/31
   ip ospf network point-to-point
   ip ospf cost 30
!
interface Loopback0
   description ROUTER_ID_AND_IBGP
   ip address 10.100.0.1/32
!
interface Loopback1
   description ORIGINATES_10.100.16.1/20
   ip address 10.100.16.1/20
!
interface Loopback2
   description ORIGINATES_10.100.32.1/20
   ip address 10.100.32.1/20
!
interface Loopback3
   description ORIGINATES_10.100.48.1/20
   ip address 10.100.48.1/20
!
interface Loopback4
   description ORIGINATES_10.100.64.1/20
   ip address 10.100.64.1/20
!
ip routing
!
router ospf 1
   router-id 10.100.0.1
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.100.0.0/22 area 0.0.0.0
   network 10.100.255.0/24 area 0.0.0.0
   max-lsa 12000
!
ip prefix-list PL-OURS seq 10 permit 10.100.0.0/16
!
ip prefix-list PL-CUST1 seq 10 permit 10.5.0.0/16
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
!
ip community-list CL-TRANSIT permit 65100:100
ip community-list CL-PEER permit 65100:150
ip community-list CL-CUSTOMER permit 65100:200
!
! ---------------- ingress: tag and rank by neighbor type ----------------
route-map RM-FROM-TRANSIT permit 10
   description upstream: lowest preference, tag as transit-learned
   set local-preference 100
   set community 65100:100 additive
!
route-map RM-FROM-PEER permit 10
   description settlement-free peer: better than transit, tag as peer-learned
   set local-preference 150
   set community 65100:150 additive
!
route-map RM-FROM-CUSTOMER permit 10
   description customer: best preference, and accept ONLY their prefixes
   match ip address prefix-list PL-CUST1
   set local-preference 200
   set community 65100:200 additive
!
! ---------------- egress: default deny, permit only what we may announce ----------------
! To an upstream or a peer we may announce our own space and our customers'.
! Announcing transit- or peer-learned routes would make us free transit.
route-map RM-TO-TRANSIT permit 10
   description our aggregate
   match ip address prefix-list PL-OURS
!
route-map RM-TO-TRANSIT permit 20
   description customer routes, which we are paid to carry
   match community CL-CUSTOMER
!
route-map RM-TO-PEER permit 10
   match ip address prefix-list PL-OURS
!
route-map RM-TO-PEER permit 20
   match community CL-CUSTOMER
!
! A customer gets everything we know. Here, a default is enough.
route-map RM-TO-CUSTOMER permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-TO-CUSTOMER permit 20
   match ip address prefix-list PL-OURS
!
route-map RM-TO-CUSTOMER permit 30
   match community CL-TRANSIT
!
route-map RM-TO-CUSTOMER permit 40
   match community CL-PEER
!
router bgp 65100
   router-id 10.100.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor IBGP peer group
   neighbor IBGP remote-as 65100
   neighbor IBGP update-source Loopback0
   neighbor IBGP send-community
   neighbor IBGP maximum-routes 12000
   neighbor 10.100.0.2 peer group IBGP
   neighbor 10.100.0.2 description edge1
   neighbor 10.100.0.3 peer group IBGP
   neighbor 10.100.0.3 description edge2
   network 10.100.16.0/20
   network 10.100.32.0/20
   network 10.100.48.0/20
   network 10.100.64.0/20
   !
   address-family ipv4
      neighbor IBGP activate
!
end
