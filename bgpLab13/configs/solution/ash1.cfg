! ash1 | bgp-lab13 | AS 65010 edge | generated by tools/gen_configs.py
hostname ash1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description WAVE-SEA-ASH-A_protected_to_sea1
   no switchport
   mtu 9100
   ip address 10.254.0.3/31
   ip ospf cost 100
!
interface Ethernet2
   description WAVE-SEA-ASH-B_unprotected_to_sea2
   no switchport
   mtu 9100
   ip address 10.254.0.5/31
   ip ospf cost 120
!
interface Loopback0
   description ROUTER_ID / iBGP SOURCE
   ip address 10.255.0.3/32
!
ip routing
!
ip route 203.0.113.0/24 Null0 254
ip route 192.0.2.0/24 Null0 254
!
ip prefix-list PL-OUR-SPACE seq 10 permit 192.0.2.0/24
ip prefix-list PL-OUR-SPACE seq 20 permit 198.51.100.0/24
ip prefix-list PL-OUR-SPACE seq 30 permit 203.0.113.0/24
!
ip prefix-list PL-BOGON seq 10 deny 0.0.0.0/0
ip prefix-list PL-BOGON seq 20 deny 0.0.0.0/8 le 32
ip prefix-list PL-BOGON seq 30 deny 10.0.0.0/8 le 32
ip prefix-list PL-BOGON seq 40 deny 127.0.0.0/8 le 32
ip prefix-list PL-BOGON seq 50 deny 169.254.0.0/16 le 32
ip prefix-list PL-BOGON seq 60 deny 172.16.0.0/12 le 32
ip prefix-list PL-BOGON seq 70 deny 192.168.0.0/16 le 32
ip prefix-list PL-BOGON seq 80 deny 224.0.0.0/4 le 32
ip prefix-list PL-BOGON seq 90 deny 240.0.0.0/4 le 32
ip prefix-list PL-BOGON seq 100 permit 0.0.0.0/0 ge 8 le 24
!
ip prefix-list PL-IRR-AS65401 seq 10 permit 100.110.0.0/16 le 24
!
ip prefix-list PL-IRR-AS65402 seq 10 permit 100.111.0.0/16 le 24
!
ip prefix-list PL-IRR-AS65500 seq 10 permit 100.120.0.0/16 le 24
!
ip prefix-list PL-CLOUD-REGIONS seq 10 permit 100.130.0.0/16 le 24
ip prefix-list PL-CLOUD-REGIONS seq 20 permit 100.131.0.0/16 le 24
!
ip prefix-list PL-OUR-SPACE-ANY seq 10 permit 192.0.2.0/24 le 32
ip prefix-list PL-OUR-SPACE-ANY seq 20 permit 198.51.100.0/24 le 32
ip prefix-list PL-OUR-SPACE-ANY seq 30 permit 203.0.113.0/24 le 32
!
route-map RM-TRANSIT1-IN deny 5
   description never accept our own space from anyone
   match ip address prefix-list PL-OUR-SPACE-ANY
!
route-map RM-TRANSIT1-IN permit 10
   match ip address prefix-list PL-BOGON
   set local-preference 100
   set community 65010:100 additive
!
route-map RM-TRANSIT2-IN deny 5
   description never accept our own space from anyone
   match ip address prefix-list PL-OUR-SPACE-ANY
!
route-map RM-TRANSIT2-IN permit 10
   match ip address prefix-list PL-BOGON
   set local-preference 90
   set community 65010:101 additive
!
route-map RM-IXRS-IN deny 5
   description never accept our own space from anyone
   match ip address prefix-list PL-OUR-SPACE-ANY
!
route-map RM-IXRS-IN permit 10
   match ip address prefix-list PL-IRR-AS65401
   set local-preference 200
   set community 65010:200 additive
!
route-map RM-IXBILAT-IN deny 5
   description never accept our own space from anyone
   match ip address prefix-list PL-OUR-SPACE-ANY
!
route-map RM-IXBILAT-IN permit 10
   match ip address prefix-list PL-IRR-AS65402
   set local-preference 200
   set community 65010:201 additive
!
route-map RM-PNI-IN deny 5
   description never accept our own space from anyone
   match ip address prefix-list PL-OUR-SPACE-ANY
!
route-map RM-PNI-IN permit 10
   match ip address prefix-list PL-IRR-AS65500
   set local-preference 300
   set community 65010:300 additive
!
route-map RM-CLOUD-IN deny 5
   description never accept our own space from anyone
   match ip address prefix-list PL-OUR-SPACE-ANY
!
route-map RM-CLOUD-IN permit 10
   match ip address prefix-list PL-CLOUD-REGIONS
   set local-preference 400
   set community 65010:400 additive
!
route-map RM-OUR-SPACE-OUT permit 10
   match ip address prefix-list PL-OUR-SPACE
!
router ospf 1
   router-id 10.255.0.3
   network 10.255.0.3/32 area 0.0.0.0
   network 10.254.0.2/31 area 0.0.0.0
   network 10.254.0.4/31 area 0.0.0.0
   max-lsa 12000
!
router bgp 65010
   router-id 10.255.0.3
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 4
   bgp log-neighbor-changes
   neighbor IBGP peer group
   neighbor IBGP remote-as 65010
   neighbor IBGP update-source Loopback0
   neighbor IBGP next-hop-self
   neighbor IBGP send-community
   neighbor IBGP maximum-routes 12000
   neighbor 10.255.0.1 peer group IBGP
   neighbor 10.255.0.2 peer group IBGP
   network 203.0.113.0/24
   network 192.0.2.0/24
   !
   address-family ipv4
      neighbor IBGP activate
!
end
