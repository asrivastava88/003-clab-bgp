! ixrs | bgp-lab13 | AS 65300 Seattle Exchange route server | generated by tools/gen_configs.py
hostname ixrs
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description IX_PEERING_LAN
   no switchport
   mtu 1500
   ip address 10.200.0.1/24
!
interface Loopback0
   ip address 10.255.3.1/32
!
ip routing
!
ip route 100.120.0.0/18 Null0 254
ip route 192.0.2.0/24 Null0 254
!
ip prefix-list PL-RS-LEAK seq 10 permit 100.120.0.0/18
ip prefix-list PL-RS-LEAK seq 20 permit 192.0.2.0/24
!
route-map RM-RS-OUT permit 10
   match ip address prefix-list PL-RS-LEAK
   set as-path prepend 65401
!
route-map RM-RS-OUT permit 20
!
router bgp 65300
   router-id 10.255.3.1
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   maximum-paths 4 ecmp 4
   neighbor 10.200.0.10 next-hop-self
   neighbor 10.200.0.11 next-hop-self
   neighbor 10.200.0.10 remote-as 65010
   neighbor 10.200.0.10 description sea1_NORTHSTAR
   neighbor 10.200.0.10 send-community
   neighbor 10.200.0.10 route-map RM-RS-OUT out
   neighbor 10.200.0.10 maximum-routes 12000
   neighbor 10.200.0.11 remote-as 65010
   neighbor 10.200.0.11 description sea2_NORTHSTAR
   neighbor 10.200.0.11 send-community
   neighbor 10.200.0.11 route-map RM-RS-OUT out
   neighbor 10.200.0.11 maximum-routes 12000
   neighbor 10.200.0.20 remote-as 65401
   neighbor 10.200.0.20 description ixpeer1_CASCADE
   neighbor 10.200.0.20 send-community
   neighbor 10.200.0.20 maximum-routes 12000
   network 100.120.0.0/18
   network 192.0.2.0/24
   !
   address-family ipv4
      neighbor 10.200.0.10 activate
      neighbor 10.200.0.11 activate
      neighbor 10.200.0.20 activate
!
end
