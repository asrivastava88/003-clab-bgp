! cdn1 | bgp-lab13 | AS 65500 SOUNDVIEW CDN, private network interconnect | generated by tools/gen_configs.py
hostname cdn1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description PNI-CDN-A_to_sea1
   no switchport
   mtu 9100
   ip address 10.150.1.2/30
!
interface Ethernet2
   description PNI-CDN-B_to_sea2
   no switchport
   mtu 9100
   ip address 10.150.2.2/30
!
interface Loopback0
   ip address 10.255.5.1/32
!
interface Loopback1
   description REACHABLE_HOST
   ip address 100.120.0.1/32
!
interface Loopback2
   description REACHABLE_HOST
   ip address 100.120.200.1/32
!
ip routing
!
ip route 100.120.0.0/17 Null0 254
ip route 100.120.128.0/17 Null0 254
!
ip prefix-list PL-OWN seq 10 permit 100.120.0.0/17
ip prefix-list PL-OWN seq 20 permit 100.120.128.0/17
!
route-map RM-OWN-ONLY permit 10
   match ip address prefix-list PL-OWN
!
router bgp 65500
   router-id 10.255.5.1
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   maximum-paths 4 ecmp 4
   neighbor 10.150.1.1 remote-as 65010
   neighbor 10.150.1.1 description sea1_NORTHSTAR
   neighbor 10.150.1.1 send-community
   neighbor 10.150.1.1 route-map RM-OWN-ONLY out
   neighbor 10.150.1.1 maximum-routes 12000
   neighbor 10.150.2.1 remote-as 65010
   neighbor 10.150.2.1 description sea2_NORTHSTAR
   neighbor 10.150.2.1 send-community
   neighbor 10.150.2.1 route-map RM-OWN-ONLY out
   neighbor 10.150.2.1 maximum-routes 12000
   network 100.120.0.0/17
   network 100.120.128.0/17
   !
   address-family ipv4
      neighbor 10.150.1.1 activate
      neighbor 10.150.2.1 activate
!
end
