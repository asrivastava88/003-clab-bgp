! transit2 | bgp-lab13 | AS 65200 TRANSPAC, transpacific IP transit | generated by tools/gen_configs.py
hostname transit2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description TRANSIT-2_subsea_to_sea2
   no switchport
   mtu 1500
   ip address 10.201.2.2/30
!
interface Loopback0
   ip address 10.255.2.1/32
!
interface Loopback1
   description REACHABLE_HOST
   ip address 100.101.0.1/32
!
ip routing
!
ip route 100.101.0.0/16 Null0 254
ip route 100.64.0.0/12 Null0 254
ip route 100.80.0.0/12 Null0 254
ip route 100.200.0.0/16 Null0 254
ip route 100.110.0.0/16 Null0 254
ip route 100.111.0.0/16 Null0 254
ip route 100.120.0.0/17 Null0 254
ip route 100.120.128.0/17 Null0 254
ip route 100.130.0.0/16 Null0 254
ip route 100.131.0.0/16 Null0 254
ip route 100.100.0.0/16 Null0 254
!
ip prefix-list PL-ORIG-65100 seq 10 permit 100.100.0.0/16 le 24
!
ip prefix-list PL-ORIG-65401 seq 10 permit 100.110.0.0/16 le 24
!
ip prefix-list PL-ORIG-65402 seq 10 permit 100.111.0.0/16 le 24
!
ip prefix-list PL-ORIG-65500 seq 10 permit 100.120.0.0/17 le 24
ip prefix-list PL-ORIG-65500 seq 20 permit 100.120.128.0/17 le 24
!
ip prefix-list PL-ORIG-65600 seq 10 permit 100.130.0.0/16 le 24
ip prefix-list PL-ORIG-65600 seq 20 permit 100.131.0.0/16 le 24
!
route-map RM-DFZ-OUT permit 10
   match ip address prefix-list PL-ORIG-65100
   set as-path prepend 65100
!
route-map RM-DFZ-OUT permit 20
   match ip address prefix-list PL-ORIG-65401
   set as-path prepend 65401
!
route-map RM-DFZ-OUT permit 30
   match ip address prefix-list PL-ORIG-65402
   set as-path prepend 65402
!
route-map RM-DFZ-OUT permit 40
   match ip address prefix-list PL-ORIG-65500
   set as-path prepend 65500
!
route-map RM-DFZ-OUT permit 50
   match ip address prefix-list PL-ORIG-65600
   set as-path prepend 65600
!
route-map RM-DFZ-OUT permit 60
   description our own and transit-only space
!
router bgp 65200
   router-id 10.255.2.1
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   maximum-paths 4 ecmp 4
   neighbor 10.201.2.1 remote-as 65010
   neighbor 10.201.2.1 description sea2_NORTHSTAR
   neighbor 10.201.2.1 send-community
   neighbor 10.201.2.1 route-map RM-DFZ-OUT out
   neighbor 10.201.2.1 maximum-routes 12000
   network 100.101.0.0/16
   network 100.64.0.0/12
   network 100.80.0.0/12
   network 100.200.0.0/16
   network 100.110.0.0/16
   network 100.111.0.0/16
   network 100.120.0.0/17
   network 100.120.128.0/17
   network 100.130.0.0/16
   network 100.131.0.0/16
   network 100.100.0.0/16
   !
   address-family ipv4
      neighbor 10.201.2.1 activate
!
end
