! ixpeer1 | bgp-lab13 | AS 65401 CASCADE, IX peer via route server only | generated by tools/gen_configs.py
hostname ixpeer1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description IX_PEERING_LAN
   no switchport
   mtu 1500
   ip address 10.200.0.20/24
!
interface Loopback0
   ip address 10.255.4.1/32
!
interface Loopback1
   description REACHABLE_HOST
   ip address 100.110.0.1/32
!
ip routing
!
ip route 100.110.0.0/16 Null0 254
!
router bgp 65401
   router-id 10.255.4.1
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   maximum-paths 4 ecmp 4
   neighbor 10.200.0.1 remote-as 65300
   neighbor 10.200.0.1 description seattle_exchange_route_server
   neighbor 10.200.0.1 send-community
   neighbor 10.200.0.1 maximum-routes 12000
   network 100.110.0.0/16
   !
   address-family ipv4
      neighbor 10.200.0.1 activate
!
end
