! cloudgw | bgp-lab13 | AS 65600 cloud interconnect, private peering | generated by tools/gen_configs.py
hostname cloudgw
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description CLOUD-IC-A_to_sea1
   no switchport
   mtu 1500
   ip address 10.160.1.2/30
!
interface Ethernet2
   description CLOUD-IC-B_to_sea2
   no switchport
   mtu 1500
   ip address 10.160.2.2/30
!
interface Loopback0
   ip address 10.255.6.1/32
!
interface Loopback1
   description REACHABLE_HOST
   ip address 100.130.0.1/32
!
interface Loopback2
   description REACHABLE_HOST
   ip address 100.131.0.1/32
!
ip routing
!
ip route 100.130.0.0/16 Null0 254
ip route 100.131.0.0/16 Null0 254
!
ip prefix-list PL-OWN seq 10 permit 100.130.0.0/16
ip prefix-list PL-OWN seq 20 permit 100.131.0.0/16
!
route-map RM-CLOUD-A-OUT permit 10
   match ip address prefix-list PL-OWN
   set community 65600:100 additive
!
route-map RM-CLOUD-B-OUT permit 10
   match ip address prefix-list PL-OWN
   set community 65600:200 additive
!
router bgp 65600
   router-id 10.255.6.1
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   maximum-paths 4 ecmp 4
   neighbor 10.160.1.1 remote-as 65010
   neighbor 10.160.1.1 description sea1_NORTHSTAR_primary
   neighbor 10.160.1.1 send-community
   neighbor 10.160.1.1 route-map RM-CLOUD-A-OUT out
   neighbor 10.160.1.1 maximum-routes 12000
   neighbor 10.160.2.1 remote-as 65010
   neighbor 10.160.2.1 description sea2_NORTHSTAR_secondary
   neighbor 10.160.2.1 send-community
   neighbor 10.160.2.1 route-map RM-CLOUD-B-OUT out
   neighbor 10.160.2.1 maximum-routes 12000
   network 100.130.0.0/16
   network 100.131.0.0/16
   !
   address-family ipv4
      neighbor 10.160.1.1 activate
      neighbor 10.160.2.1 activate
!
end
