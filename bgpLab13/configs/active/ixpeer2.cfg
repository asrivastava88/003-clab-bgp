! ixpeer2 | bgp-lab13 | AS 65402 EVERGREEN, IX peer bilateral only | generated by tools/gen_configs.py
hostname ixpeer2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description IX_PEERING_LAN
   no switchport
   mtu 1500
   ip address 10.200.0.30/24
!
interface Loopback0
   ip address 10.255.4.2/32
!
interface Loopback1
   description REACHABLE_HOST
   ip address 100.111.0.1/32
!
ip routing
!
ip route 100.111.0.0/16 Null0 254
!
router bgp 65402
   router-id 10.255.4.2
   no bgp default ipv4-unicast
   bgp log-neighbor-changes
   maximum-paths 4 ecmp 4
   neighbor 10.200.0.10 remote-as 65010
   neighbor 10.200.0.10 description sea1_NORTHSTAR_bilateral
   neighbor 10.200.0.10 send-community
   neighbor 10.200.0.10 maximum-routes 12000
   neighbor 10.200.0.11 remote-as 65010
   neighbor 10.200.0.11 description sea2_NORTHSTAR_bilateral
   neighbor 10.200.0.11 send-community
   neighbor 10.200.0.11 maximum-routes 12000
   network 100.111.0.0/16
   !
   address-family ipv4
      neighbor 10.200.0.10 activate
      neighbor 10.200.0.11 activate
!
end
