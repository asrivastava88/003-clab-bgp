! rail2 | bgp-lab12 | rail | generated by tools/gen_configs.py
hostname rail2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.3/31
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ip address 10.1.2.3/31
!
interface Ethernet3
   description SERVER_gpu1
   no switchport
   mtu 9214
   ip address 10.2.2.0/31
!
interface Ethernet4
   description SERVER_gpu2
   no switchport
   mtu 9214
   ip address 10.2.2.2/31
!
interface Ethernet5
   description SERVER_gpu3
   no switchport
   mtu 9214
   ip address 10.2.2.4/31
!
interface Loopback0
   ip address 10.0.0.12/32
!
ip routing
!
ip prefix-list PL-ADVERTISE seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-ADVERTISE seq 20 permit 10.10.0.0/16 eq 32
ip prefix-list PL-ADVERTISE seq 30 permit 10.20.0.0/16 eq 32
!
route-map RM-ADVERTISE permit 10
   match ip address prefix-list PL-ADVERTISE
!
router bgp 65101
   router-id 10.0.0.12
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   neighbor FABRIC peer group
   neighbor FABRIC remote-as 65100
   neighbor FABRIC send-community
   neighbor FABRIC maximum-routes 12000
   neighbor SERVERS peer group
   neighbor SERVERS send-community
   neighbor SERVERS maximum-routes 100
   neighbor 10.1.1.2 peer group FABRIC
   neighbor 10.1.1.2 description spine1
   neighbor 10.1.2.2 peer group FABRIC
   neighbor 10.1.2.2 description spine2
   neighbor 10.2.2.1 peer group SERVERS
   neighbor 10.2.2.1 remote-as 65201
   neighbor 10.2.2.1 description gpu1
   neighbor 10.2.2.3 peer group SERVERS
   neighbor 10.2.2.3 remote-as 65202
   neighbor 10.2.2.3 description gpu2
   neighbor 10.2.2.5 peer group SERVERS
   neighbor 10.2.2.5 remote-as 65203
   neighbor 10.2.2.5 description gpu3
   redistribute connected route-map RM-ADVERTISE
   !
   address-family ipv4
      neighbor FABRIC activate
      neighbor SERVERS activate
!
end
