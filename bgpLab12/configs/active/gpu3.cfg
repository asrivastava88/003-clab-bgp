! gpu3 | bgp-lab12 | compute node, runs BGP | generated by tools/gen_configs.py
hostname gpu3
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description NIC1_to_rail1
   no switchport
   mtu 9214
   ip address 10.2.1.5/31
!
interface Ethernet2
   description NIC2_to_rail2
   no switchport
   mtu 9214
   ip address 10.2.2.5/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.0.23/32
!
interface Loopback1
   description COMPUTE_ENDPOINT
   ip address 10.10.0.3/32
!
ip routing
!
ip prefix-list PL-ADVERTISE seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-ADVERTISE seq 20 permit 10.10.0.0/16 eq 32
ip prefix-list PL-ADVERTISE seq 30 permit 10.20.0.0/16 eq 32
!
route-map RM-ADVERTISE permit 10
   match ip address prefix-list PL-ADVERTISE
!
router bgp 65203
   router-id 10.0.0.23
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   neighbor RAILS peer group
   neighbor RAILS send-community
   neighbor RAILS maximum-routes 12000
   neighbor 10.2.1.4 peer group RAILS
   neighbor 10.2.1.4 remote-as 65101
   neighbor 10.2.1.4 description rail1
   neighbor 10.2.2.4 peer group RAILS
   neighbor 10.2.2.4 remote-as 65101
   neighbor 10.2.2.4 description rail2
   redistribute connected route-map RM-ADVERTISE
   !
   address-family ipv4
      neighbor RAILS activate
!
end
