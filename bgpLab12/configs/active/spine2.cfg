! spine2 | bgp-lab12 | spine | generated by tools/gen_configs.py
hostname spine2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description P2P_rail1
   no switchport
   mtu 9214
   ip address 10.1.2.0/31
!
interface Ethernet2
   description P2P_rail2
   no switchport
   mtu 9214
   ip address 10.1.2.2/31
!
interface Ethernet3
   description P2P_stor1
   no switchport
   mtu 9214
   ip address 10.1.2.4/31
!
interface Loopback0
   ip address 10.0.0.2/32
!
ip routing
!
ip prefix-list PL-ADVERTISE seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-ADVERTISE seq 20 permit 10.10.0.0/16 eq 32
ip prefix-list PL-ADVERTISE seq 30 permit 10.20.0.0/16 eq 32
!
route-map RM-ADVERTISE permit 10
   match ip address prefix-list PL-ADVERTISE
!
router bgp 65100
   router-id 10.0.0.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   neighbor FABRIC peer group
   neighbor FABRIC send-community
   neighbor FABRIC maximum-routes 12000
   neighbor 10.1.2.1 peer group FABRIC
   neighbor 10.1.2.1 remote-as 65101
   neighbor 10.1.2.1 description rail1
   neighbor 10.1.2.3 peer group FABRIC
   neighbor 10.1.2.3 remote-as 65101
   neighbor 10.1.2.3 description rail2
   neighbor 10.1.2.5 peer group FABRIC
   neighbor 10.1.2.5 remote-as 65103
   neighbor 10.1.2.5 description stor1
   redistribute connected route-map RM-ADVERTISE
   !
   address-family ipv4
      neighbor FABRIC activate
!
end
