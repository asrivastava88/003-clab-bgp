! nfs1 | bgp-lab12 | compute node, runs BGP | generated by tools/gen_configs.py
hostname nfs1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description NIC1_to_stor1
   no switchport
   mtu 9214
   ip address 10.2.3.1/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.0.24/32
!
interface Loopback1
   description COMPUTE_ENDPOINT
   ip address 10.20.0.1/32
!
ip routing
!
ip prefix-list PL-ADVERTISE seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-ADVERTISE seq 20 permit 10.10.0.0/16 eq 32
ip prefix-list PL-ADVERTISE seq 30 permit 10.20.0.0/16 eq 32
!
route-map RM-ADVERTISE permit 10
   match ip address prefix-list PL-ADVERTISE
!
router bgp 65204
   router-id 10.0.0.24
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 8 ecmp 8
   neighbor RAILS peer group
   neighbor RAILS send-community
   neighbor RAILS maximum-routes 12000
   neighbor 10.2.3.0 peer group RAILS
   neighbor 10.2.3.0 remote-as 65103
   neighbor 10.2.3.0 description stor1
   redistribute connected route-map RM-ADVERTISE
   !
   address-family ipv4
      neighbor RAILS activate
!
end
