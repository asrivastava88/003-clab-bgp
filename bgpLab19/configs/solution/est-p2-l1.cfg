! est-p2-l1 | bgp-lab19 | leaf, Ashburn | generated by tools/gen_configs.py
hostname est-p2-l1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
vrf instance PROD
!
vrf instance DEV
!
vrf instance SHARED
!
interface Ethernet1
   description SPINE_est-p2-s1_link33
   no switchport
   mtu 9214
   ip address 10.254.0.66/31
!
interface Ethernet2
   description SPINE_est-p2-s2_link34
   no switchport
   mtu 9214
   ip address 10.254.0.68/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.2.41/32
!
interface Loopback1
   description VTEP
   ip address 10.1.2.3/32
!
interface Loopback2
   description TENANT_HOST_PROD
   vrf PROD
   ip address 10.102.11.3/32
!
interface Loopback3
   description TENANT_HOST_DEV
   vrf DEV
   ip address 10.102.21.3/32
!
interface Loopback4
   description TENANT_HOST_SHARED
   vrf SHARED
   ip address 10.102.31.3/32
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf SHARED
!
interface Vxlan1
   description TENANT_ENCAP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf PROD vni 50001
   vxlan vrf DEV vni 50002
   vxlan vrf SHARED vni 50003
!
router ospf 1
   router-id 10.0.2.41
   network 10.0.2.41/32 area 0.0.0.0
   network 10.1.2.3/32 area 0.0.0.0
   network 10.254.0.66/31 area 0.0.0.0
   network 10.254.0.68/31 area 0.0.0.0
   max-lsa 12000
!
ip prefix-list PL-TENANT seq 10 permit 10.102.0.0/16 le 32
!
route-map RM-TENANT permit 10
   description tenant space only: never the underlay or a WAN /31
   match ip address prefix-list PL-TENANT
!
router bgp 65002
   router-id 10.0.2.41
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp log-neighbor-changes
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65002
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 12000
   neighbor 10.0.2.1 peer group OVERLAY
   neighbor 10.0.2.1 description est-ss1
   neighbor 10.0.2.2 peer group OVERLAY
   neighbor 10.0.2.2 description est-ss2
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   vrf PROD
      rd 10.1.2.3:50001
      route-target import evpn 1:50001
      route-target import evpn 1:50003
      route-target export evpn 1:50001
      redistribute connected route-map RM-TENANT
   !
   vrf DEV
      rd 10.1.2.3:50002
      route-target import evpn 1:50002
      route-target import evpn 1:50003
      route-target export evpn 1:50002
      redistribute connected route-map RM-TENANT
   !
   vrf SHARED
      rd 10.1.2.3:50003
      route-target import evpn 1:50003
      route-target import evpn 1:50001
      route-target import evpn 1:50002
      route-target export evpn 1:50003
      redistribute connected route-map RM-TENANT
!
end
