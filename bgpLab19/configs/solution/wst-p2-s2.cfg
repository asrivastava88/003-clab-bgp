! wst-p2-s2 | bgp-lab19 | spine, Seattle | generated by tools/gen_configs.py
hostname wst-p2-s2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
vrf instance PROD
!
vrf instance DEV
!
vrf instance SHARED
!
interface Ethernet1
   description LEAF_wst-p2-l1_link14
   no switchport
   mtu 9214
   ip address 10.254.0.29/31
!
interface Ethernet2
   description LEAF_wst-p2-l2_link16
   no switchport
   mtu 9214
   ip address 10.254.0.33/31
!
interface Ethernet3
   description SUPERSPINE_wst-ss1_link11
   no switchport
   mtu 9214
   ip address 10.254.0.22/31
!
interface Ethernet4
   description SUPERSPINE_wst-ss2_link12
   no switchport
   mtu 9214
   ip address 10.254.0.24/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.1.22/32
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf SHARED
!
router ospf 1
   router-id 10.0.1.22
   network 10.0.1.22/32 area 0.0.0.0
   network 10.254.0.28/31 area 0.0.0.0
   network 10.254.0.32/31 area 0.0.0.0
   network 10.254.0.22/31 area 0.0.0.0
   network 10.254.0.24/31 area 0.0.0.0
   max-lsa 12000
!
!
end
