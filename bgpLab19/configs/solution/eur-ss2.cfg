! eur-ss2 | bgp-lab19 | superspine, London | generated by tools/gen_configs.py
hostname eur-ss2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
vrf instance PROD
!
vrf instance DEV
!
vrf instance SHARED
!
interface Ethernet1
   description BORDER_eur-b1_link58
   no switchport
   mtu 9214
   ip address 10.254.0.117/31
!
interface Ethernet2
   description BORDER_eur-b2_link60
   no switchport
   mtu 9214
   ip address 10.254.0.121/31
!
interface Ethernet3
   description SPINE_eur-p1-s1_link42
   no switchport
   mtu 9214
   ip address 10.254.0.85/31
!
interface Ethernet4
   description SPINE_eur-p1-s2_link44
   no switchport
   mtu 9214
   ip address 10.254.0.89/31
!
interface Ethernet5
   description SPINE_eur-p2-s1_link50
   no switchport
   mtu 9214
   ip address 10.254.0.101/31
!
interface Ethernet6
   description SPINE_eur-p2-s2_link52
   no switchport
   mtu 9214
   ip address 10.254.0.105/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.3.2/32
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf SHARED
!
router ospf 1
   router-id 10.0.3.2
   network 10.0.3.2/32 area 0.0.0.0
   network 10.254.0.116/31 area 0.0.0.0
   network 10.254.0.120/31 area 0.0.0.0
   network 10.254.0.84/31 area 0.0.0.0
   network 10.254.0.88/31 area 0.0.0.0
   network 10.254.0.100/31 area 0.0.0.0
   network 10.254.0.104/31 area 0.0.0.0
   max-lsa 12000
!
router bgp 65003
   router-id 10.0.3.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp log-neighbor-changes
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65003
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY route-reflector-client
   neighbor OVERLAY maximum-routes 12000
   neighbor 10.0.3.51 peer group OVERLAY
   neighbor 10.0.3.51 description eur-b1
   neighbor 10.0.3.52 peer group OVERLAY
   neighbor 10.0.3.52 description eur-b2
   neighbor 10.0.3.31 peer group OVERLAY
   neighbor 10.0.3.31 description eur-p1-l1
   neighbor 10.0.3.32 peer group OVERLAY
   neighbor 10.0.3.32 description eur-p1-l2
   neighbor 10.0.3.41 peer group OVERLAY
   neighbor 10.0.3.41 description eur-p2-l1
   neighbor 10.0.3.42 peer group OVERLAY
   neighbor 10.0.3.42 description eur-p2-l2
   !
   address-family evpn
      neighbor OVERLAY activate
!
end
