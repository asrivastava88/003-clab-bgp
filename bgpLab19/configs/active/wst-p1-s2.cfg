! wst-p1-s2 | bgp-lab19 | spine, Seattle | generated by tools/gen_configs.py
hostname wst-p1-s2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
vrf instance PROD
!
vrf instance DEV
!
vrf instance SHARED
!
interface Ethernet1
   description LEAF_wst-p1-l1_link6
   no switchport
   mtu 9214
   ip address 10.254.0.13/31
!
interface Ethernet2
   description LEAF_wst-p1-l2_link8
   no switchport
   mtu 9214
   ip address 10.254.0.17/31
!
interface Ethernet3
   description SUPERSPINE_wst-ss1_link3
   no switchport
   mtu 9214
   ip address 10.254.0.6/31
!
interface Ethernet4
   description SUPERSPINE_wst-ss2_link4
   no switchport
   mtu 9214
   ip address 10.254.0.8/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.1.12/32
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf SHARED
!
router ospf 1
   router-id 10.0.1.12
   network 10.0.1.12/32 area 0.0.0.0
   network 10.254.0.12/31 area 0.0.0.0
   network 10.254.0.16/31 area 0.0.0.0
   network 10.254.0.6/31 area 0.0.0.0
   network 10.254.0.8/31 area 0.0.0.0
   max-lsa 12000
!
!
end
