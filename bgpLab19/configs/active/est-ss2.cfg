! est-ss2 | bgp-lab19 | superspine, Ashburn | generated by tools/gen_configs.py
hostname est-ss2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
vrf instance PROD
!
vrf instance DEV
!
vrf instance SHARED
!
interface Ethernet1
   description BORDER_est-b1_link38
   no switchport
   mtu 9214
   ip address 10.254.0.77/31
!
interface Ethernet2
   description BORDER_est-b2_link40
   no switchport
   mtu 9214
   ip address 10.254.0.81/31
!
interface Ethernet3
   description SPINE_est-p1-s1_link22
   no switchport
   mtu 9214
   ip address 10.254.0.45/31
!
interface Ethernet4
   description SPINE_est-p1-s2_link24
   no switchport
   mtu 9214
   ip address 10.254.0.49/31
!
interface Ethernet5
   description SPINE_est-p2-s1_link30
   no switchport
   mtu 9214
   ip address 10.254.0.61/31
!
interface Ethernet6
   description SPINE_est-p2-s2_link32
   no switchport
   mtu 9214
   ip address 10.254.0.65/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.2.2/32
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf SHARED
!
router ospf 1
   router-id 10.0.2.2
   network 10.0.2.2/32 area 0.0.0.0
   network 10.254.0.76/31 area 0.0.0.0
   network 10.254.0.80/31 area 0.0.0.0
   network 10.254.0.44/31 area 0.0.0.0
   network 10.254.0.48/31 area 0.0.0.0
   network 10.254.0.60/31 area 0.0.0.0
   network 10.254.0.64/31 area 0.0.0.0
   max-lsa 12000
!
router bgp 65002
   router-id 10.0.2.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp log-neighbor-changes
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65002
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY route-reflector-client
   neighbor OVERLAY maximum-routes 12000
   neighbor 10.0.2.51 peer group OVERLAY
   neighbor 10.0.2.51 description est-b1
   neighbor 10.0.2.52 peer group OVERLAY
   neighbor 10.0.2.52 description est-b2
   neighbor 10.0.2.31 peer group OVERLAY
   neighbor 10.0.2.31 description est-p1-l1
   neighbor 10.0.2.32 peer group OVERLAY
   neighbor 10.0.2.32 description est-p1-l2
   neighbor 10.0.2.41 peer group OVERLAY
   neighbor 10.0.2.41 description est-p2-l1
   neighbor 10.0.2.42 peer group OVERLAY
   neighbor 10.0.2.42 description est-p2-l2
   !
   address-family evpn
      neighbor OVERLAY activate
!
end
