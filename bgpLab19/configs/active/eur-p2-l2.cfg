! eur-p2-l2 | bgp-lab19 | leaf, London | generated by tools/gen_configs.py
hostname eur-p2-l2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
vrf instance PROD
!
vrf instance DEV
!
vrf instance SHARED
!
interface Ethernet1
   description SPINE_eur-p2-s1_link55
   no switchport
   mtu 9214
   ip address 10.254.0.110/31
!
interface Ethernet2
   description SPINE_eur-p2-s2_link56
   no switchport
   mtu 9214
   ip address 10.254.0.112/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.3.42/32
!
interface Loopback1
   description VTEP
   ip address 10.1.3.4/32
!
interface Loopback2
   description TENANT_HOST_PROD
   vrf PROD
   ip address 10.103.11.4/32
!
interface Loopback3
   description TENANT_HOST_DEV
   vrf DEV
   ip address 10.103.21.4/32
!
interface Loopback4
   description TENANT_HOST_SHARED
   vrf SHARED
   ip address 10.103.31.4/32
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf SHARED
!
interface Vxlan1
   description TENANT_ENCAP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf PROD vni 50001
   vxlan vrf DEV vni 50002
   vxlan vrf SHARED vni 50003
!
router ospf 1
   router-id 10.0.3.42
   network 10.0.3.42/32 area 0.0.0.0
   network 10.1.3.4/32 area 0.0.0.0
   network 10.254.0.110/31 area 0.0.0.0
   network 10.254.0.112/31 area 0.0.0.0
   max-lsa 12000
!
ip prefix-list PL-TENANT seq 10 permit 10.103.0.0/16 le 32
!
route-map RM-TENANT permit 10
   description tenant space only: never the underlay or a WAN /31
   match ip address prefix-list PL-TENANT
!
router bgp 65003
   router-id 10.0.3.42
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp log-neighbor-changes
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65003
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY maximum-routes 12000
   neighbor 10.0.3.1 peer group OVERLAY
   neighbor 10.0.3.1 description eur-ss1
   neighbor 10.0.3.2 peer group OVERLAY
   neighbor 10.0.3.2 description eur-ss2
   !
   address-family evpn
      neighbor OVERLAY activate
   !
   vrf PROD
      rd 10.1.3.4:50001
      route-target import evpn 1:50001
      route-target import evpn 1:50003
      route-target export evpn 1:50001
      redistribute connected route-map RM-TENANT
   !
   vrf DEV
      rd 10.1.3.4:50002
      route-target import evpn 1:50002
      route-target import evpn 1:50003
      route-target export evpn 1:50002
      redistribute connected route-map RM-TENANT
   !
   vrf SHARED
      rd 10.1.3.4:50003
      route-target import evpn 1:50003
      route-target import evpn 1:50001
      route-target import evpn 1:50002
      route-target export evpn 1:50003
      redistribute connected route-map RM-TENANT
!
end
