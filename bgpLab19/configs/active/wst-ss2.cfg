! wst-ss2 | bgp-lab19 | superspine, Seattle | generated by tools/gen_configs.py
hostname wst-ss2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
vrf instance PROD
!
vrf instance DEV
!
vrf instance SHARED
!
interface Ethernet1
   description BORDER_wst-b1_link18
   no switchport
   mtu 9214
   ip address 10.254.0.37/31
!
interface Ethernet2
   description BORDER_wst-b2_link20
   no switchport
   mtu 9214
   ip address 10.254.0.41/31
!
interface Ethernet3
   description SPINE_wst-p1-s1_link2
   no switchport
   mtu 9214
   ip address 10.254.0.5/31
!
interface Ethernet4
   description SPINE_wst-p1-s2_link4
   no switchport
   mtu 9214
   ip address 10.254.0.9/31
!
interface Ethernet5
   description SPINE_wst-p2-s1_link10
   no switchport
   mtu 9214
   ip address 10.254.0.21/31
!
interface Ethernet6
   description SPINE_wst-p2-s2_link12
   no switchport
   mtu 9214
   ip address 10.254.0.25/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.0.1.2/32
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf SHARED
!
router ospf 1
   router-id 10.0.1.2
   network 10.0.1.2/32 area 0.0.0.0
   network 10.254.0.36/31 area 0.0.0.0
   network 10.254.0.40/31 area 0.0.0.0
   network 10.254.0.4/31 area 0.0.0.0
   network 10.254.0.8/31 area 0.0.0.0
   network 10.254.0.20/31 area 0.0.0.0
   network 10.254.0.24/31 area 0.0.0.0
   max-lsa 12000
!
router bgp 65001
   router-id 10.0.1.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp log-neighbor-changes
   neighbor OVERLAY peer group
   neighbor OVERLAY remote-as 65001
   neighbor OVERLAY update-source Loopback0
   neighbor OVERLAY send-community extended
   neighbor OVERLAY route-reflector-client
   neighbor OVERLAY maximum-routes 12000
   neighbor 10.0.1.51 peer group OVERLAY
   neighbor 10.0.1.51 description wst-b1
   neighbor 10.0.1.52 peer group OVERLAY
   neighbor 10.0.1.52 description wst-b2
   neighbor 10.0.1.31 peer group OVERLAY
   neighbor 10.0.1.31 description wst-p1-l1
   neighbor 10.0.1.32 peer group OVERLAY
   neighbor 10.0.1.32 description wst-p1-l2
   neighbor 10.0.1.41 peer group OVERLAY
   neighbor 10.0.1.41 description wst-p2-l1
   neighbor 10.0.1.42 peer group OVERLAY
   neighbor 10.0.1.42 description wst-p2-l2
   !
   address-family evpn
      neighbor OVERLAY activate
!
end
