! bleaf1 | bgp-lab01 | solution config | generated by tools/gen_configs.py
hostname bleaf1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vrf instance RED
!
vrf instance BLUE
!
interface Ethernet1
   description P2P_spine1_Ethernet4
   no switchport
   mtu 9214
   ip address 10.1.1.7/31
!
interface Ethernet2
   description P2P_spine2_Ethernet4
   no switchport
   mtu 9214
   ip address 10.1.2.7/31
!
interface Ethernet3
   description WAN_isp1_Ethernet0_vrf_RED
   no switchport
   vrf RED
   ip address 172.16.1.1/30
!
interface Ethernet4
   description WAN_isp1_Ethernet4_vrf_BLUE
   no switchport
   vrf BLUE
   ip address 172.16.2.1/30
!
interface Loopback0
   description ROUTER_ID_EVPN
   ip address 10.0.0.14/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.14/32
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf RED vni 50001
   vxlan vrf BLUE vni 50002
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf RED
ip routing vrf BLUE
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.0.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65104
   router-id 10.0.0.14
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65100
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN remote-as 65100
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community
   neighbor EVPN maximum-routes 0
   neighbor 10.1.1.6 peer group UNDERLAY
   neighbor 10.1.1.6 description spine1
   neighbor 10.1.2.6 peer group UNDERLAY
   neighbor 10.1.2.6 description spine2
   neighbor 10.0.0.1 peer group EVPN
   neighbor 10.0.0.1 description spine1-evpn
   neighbor 10.0.0.2 peer group EVPN
   neighbor 10.0.0.2 description spine2-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
   !
   vrf RED
      rd 10.0.0.14:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.14
      neighbor 172.16.1.2 remote-as 65000
      neighbor 172.16.1.2 description isp1_Ethernet0
      neighbor 172.16.1.2 maximum-routes 1000
      redistribute connected
      !
      address-family ipv4
         neighbor 172.16.1.2 activate
   !
   vrf BLUE
      rd 10.0.0.14:50002
      route-target import evpn 50002:50002
      route-target export evpn 50002:50002
      router-id 10.0.0.14
      neighbor 172.16.2.2 remote-as 65000
      neighbor 172.16.2.2 description isp1_Ethernet4
      neighbor 172.16.2.2 maximum-routes 1000
      redistribute connected
      !
      address-family ipv4
         neighbor 172.16.2.2 activate
   !
!
end
