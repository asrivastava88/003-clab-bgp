! isp1 (SONiC-VS / FRR) | AS 65000 | Internet edge + inter-VRF "fusion" router
! RED handoff  : Ethernet0 172.16.1.2/30 <-> bleaf1 vrf RED  172.16.1.1
! BLUE handoff : Ethernet4 172.16.2.2/30 <-> bleaf1 vrf BLUE 172.16.2.1
!
ip prefix-list PL-INET seq 5 permit 203.0.113.0/24
ip prefix-list PL-RED  seq 5 permit 10.10.0.0/16 le 32
ip prefix-list PL-BLUE seq 5 permit 10.30.0.0/16 le 32
!
route-map RM-FROM-RED permit 10
 match ip address prefix-list PL-RED
!
route-map RM-FROM-BLUE permit 10
 match ip address prefix-list PL-BLUE
!
route-map RM-TO-RED permit 10
 match ip address prefix-list PL-INET
route-map RM-TO-RED permit 20
 match ip address prefix-list PL-BLUE
!
route-map RM-TO-BLUE permit 10
 match ip address prefix-list PL-INET
route-map RM-TO-BLUE permit 20
 match ip address prefix-list PL-RED
!
ip route 203.0.113.0/24 blackhole
!
router bgp 65000
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 neighbor 172.16.1.1 remote-as 65104
 neighbor 172.16.1.1 description bleaf1-vrf-RED
 neighbor 172.16.2.1 remote-as 65104
 neighbor 172.16.2.1 description bleaf1-vrf-BLUE
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 172.16.1.1 default-originate
  neighbor 172.16.1.1 remove-private-AS all
  neighbor 172.16.1.1 route-map RM-FROM-RED in
  neighbor 172.16.1.1 route-map RM-TO-RED out
  neighbor 172.16.2.1 default-originate
  neighbor 172.16.2.1 remove-private-AS all
  neighbor 172.16.2.1 route-map RM-FROM-BLUE in
  neighbor 172.16.2.1 route-map RM-TO-BLUE out
 exit-address-family
!
