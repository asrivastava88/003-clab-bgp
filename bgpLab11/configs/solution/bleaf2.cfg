!
router bgp 65105
   router-id 10.0.0.15
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65100
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN remote-as 65100
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor EVPN maximum-routes 0
   neighbor 10.1.1.8 peer group UNDERLAY
   neighbor 10.1.1.8 description spine1
   neighbor 10.1.2.8 peer group UNDERLAY
   neighbor 10.1.2.8 description spine2
   neighbor 10.0.0.1 peer group EVPN
   neighbor 10.0.0.1 description spine1-evpn
   neighbor 10.0.0.2 peer group EVPN
   neighbor 10.0.0.2 description spine2-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
   !
   vrf RED
      rd 10.0.0.15:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.15
      maximum-paths 4 ecmp 4
      neighbor 172.16.21.2 remote-as 65200
      neighbor 172.16.21.2 description wan-RED
      neighbor 172.16.21.2 route-map RM-RED-IN in
      neighbor 172.16.21.2 route-map RM-RED-OUT out
      neighbor 172.16.21.2 maximum-routes 1000
      redistribute connected
      !
      address-family ipv4
         neighbor 172.16.21.2 activate
   !
   vrf BLUE
      rd 10.0.0.15:50002
      route-target import evpn 50002:50002
      route-target export evpn 50002:50002
      router-id 10.0.0.15
      maximum-paths 4 ecmp 4
      neighbor 172.16.22.2 remote-as 65200
      neighbor 172.16.22.2 description wan-BLUE
      neighbor 172.16.22.2 route-map RM-BLUE-IN in
      neighbor 172.16.22.2 route-map RM-BLUE-OUT out
      neighbor 172.16.22.2 maximum-routes 1000
