! bleaf2 | bgp-lab11 | generated by tools/gen_configs.py
hostname bleaf2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vrf instance RED
!
vrf instance BLUE
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.9/31
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
