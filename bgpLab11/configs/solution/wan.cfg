! wan | bgp-lab11 | generated by tools/gen_configs.py
hostname wan
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description CUST_bleaf1
   no switchport
   mtu 9214
!
interface Ethernet1.101
   description CUST_bleaf1_RED
   encapsulation dot1q vlan 101
   ip address 172.16.11.2/30
!
interface Ethernet1.102
   description CUST_bleaf1_BLUE
   encapsulation dot1q vlan 102
   ip address 172.16.12.2/30
!
interface Ethernet2
   description CUST_bleaf2
   no switchport
   mtu 9214
!
interface Ethernet2.101
   description CUST_bleaf2_RED
   encapsulation dot1q vlan 101
   ip address 172.16.21.2/30
!
interface Ethernet2.102
   description CUST_bleaf2_BLUE
   encapsulation dot1q vlan 102
   ip address 172.16.22.2/30
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Loopback1
   description internet target
   ip address 203.0.113.10/24
!
ip routing
!
ip route 203.0.113.0/24 Null0
!
router bgp 65200
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor 172.16.11.1 remote-as 65104
   neighbor 172.16.11.1 description bleaf1-RED
   neighbor 172.16.11.1 default-originate
   neighbor 172.16.11.1 maximum-routes 1000
   neighbor 172.16.12.1 remote-as 65104
   neighbor 172.16.12.1 description bleaf1-BLUE
   neighbor 172.16.12.1 default-originate
   neighbor 172.16.12.1 maximum-routes 1000
   neighbor 172.16.21.1 remote-as 65105
   neighbor 172.16.21.1 description bleaf2-RED
   neighbor 172.16.21.1 default-originate
   neighbor 172.16.21.1 maximum-routes 1000
   neighbor 172.16.22.1 remote-as 65105
   neighbor 172.16.22.1 description bleaf2-BLUE
   neighbor 172.16.22.1 default-originate
   neighbor 172.16.22.1 maximum-routes 1000
   network 203.0.113.0/24
   !
   address-family ipv4
      neighbor 172.16.11.1 activate
      neighbor 172.16.12.1 activate
      neighbor 172.16.21.1 activate
      neighbor 172.16.22.1 activate
!
end
