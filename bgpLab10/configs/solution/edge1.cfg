! edge1 | bgp-lab10 | solution | generated by tools/gen_configs.py
hostname edge1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description IGP_core
   no switchport
   mtu 9214
   ip address 10.0.255.1/31
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet2
   description IGP_edge2
   no switchport
   mtu 9214
   ip address 10.0.255.4/31
   ip ospf network point-to-point
   ip ospf cost 100
!
interface Ethernet3
   description EBGP_transit_AS65200_transit
   no switchport
   ip address 208.0.1.1/30
!
interface Ethernet4
   description EBGP_peer1_AS65400_peer
   no switchport
   ip address 208.0.2.1/30
!
interface Loopback0
   description ROUTER_ID_AND_IBGP
   ip address 10.0.0.2/32
!
ip routing
!
router ospf 1
   router-id 10.0.0.2
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.0.0.0/22 area 0.0.0.0
   network 10.0.255.0/24 area 0.0.0.0
   network 203.0.48.0/24 area 0.0.0.0
   max-lsa 12000
!
ip prefix-list PL-BOGONS seq 10 permit 0.0.0.0/8 le 32   ! this network
ip prefix-list PL-BOGONS seq 20 permit 10.0.0.0/8 le 32   ! RFC1918
ip prefix-list PL-BOGONS seq 30 permit 100.64.0.0/10 le 32   ! CGNAT
ip prefix-list PL-BOGONS seq 40 permit 127.0.0.0/8 le 32   ! loopback
ip prefix-list PL-BOGONS seq 50 permit 169.254.0.0/16 le 32   ! link local
ip prefix-list PL-BOGONS seq 60 permit 172.16.0.0/12 le 32   ! RFC1918
ip prefix-list PL-BOGONS seq 70 permit 192.0.2.0/24 le 32   ! TEST-NET-1
ip prefix-list PL-BOGONS seq 80 permit 192.168.0.0/16 le 32   ! RFC1918
ip prefix-list PL-BOGONS seq 90 permit 224.0.0.0/4 le 32   ! multicast
ip prefix-list PL-BOGONS seq 100 permit 240.0.0.0/4 le 32   ! reserved
!
ip prefix-list PL-OURS seq 10 permit 203.0.0.0/16
!
ip prefix-list PL-DEFAULT seq 10 permit 0.0.0.0/0
!
ip prefix-list PL-CUST1 seq 10 permit 206.0.0.0/16 le 24
!
ip prefix-list PL-CUST2 seq 10 permit 207.0.0.0/16 le 24
!
ip community-list CL-TRANSIT permit 65100:100
ip community-list CL-PEER permit 65100:150
ip community-list CL-CUSTOMER permit 65100:200
!
route-map RM-FROM-TRANSIT deny 5
   description nobody outside should be sending us these
   match ip address prefix-list PL-BOGONS
!
route-map RM-FROM-TRANSIT deny 6
   description nobody outside originates our own space
   match ip address prefix-list PL-OURS
!
route-map RM-FROM-TRANSIT permit 10
   set local-preference 100
   set community 65100:100 additive
!
route-map RM-FROM-PEER deny 5
   description nobody outside should be sending us these
   match ip address prefix-list PL-BOGONS
!
route-map RM-FROM-PEER deny 6
   description nobody outside originates our own space
   match ip address prefix-list PL-OURS
!
route-map RM-FROM-PEER permit 10
   set local-preference 150
   set community 65100:150 additive
!
route-map RM-FROM-CUST1 deny 5
   match ip address prefix-list PL-BOGONS
!
route-map RM-FROM-CUST1 deny 6
   match ip address prefix-list PL-OURS
!
route-map RM-FROM-CUST1 permit 10
   description a customer gets to announce exactly what they registered
   match ip address prefix-list PL-CUST1
   set local-preference 200
   set community 65100:200 additive
!
route-map RM-FROM-CUST2 deny 5
   match ip address prefix-list PL-BOGONS
!
route-map RM-FROM-CUST2 deny 6
   match ip address prefix-list PL-OURS
!
route-map RM-FROM-CUST2 permit 10
   description a customer gets to announce exactly what they registered
   match ip address prefix-list PL-CUST2
   set local-preference 200
   set community 65100:200 additive
!
route-map RM-TO-TRANSIT permit 10
   match ip address prefix-list PL-OURS
!
route-map RM-TO-TRANSIT permit 20
   match community CL-CUSTOMER
!
route-map RM-TO-PEER permit 10
   match ip address prefix-list PL-OURS
!
route-map RM-TO-PEER permit 20
   match community CL-CUSTOMER
!
route-map RM-TO-CUSTOMER permit 10
   description a default is all they contracted for
   match ip address prefix-list PL-DEFAULT
!
router bgp 65100
   router-id 10.0.0.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor IBGP peer group
   neighbor IBGP remote-as 65100
   neighbor IBGP update-source Loopback0
   neighbor IBGP send-community
   neighbor IBGP maximum-routes 12000
   neighbor IBGP next-hop-self
   neighbor 10.0.0.1 peer group IBGP
   neighbor 10.0.0.1 description core
   neighbor 10.0.0.3 peer group IBGP
   neighbor 10.0.0.3 description edge2
   neighbor 208.0.1.2 remote-as 65200
   neighbor 208.0.1.2 description transit-transit
   neighbor 208.0.1.2 send-community
   neighbor 208.0.1.2 route-map RM-FROM-TRANSIT in
   neighbor 208.0.1.2 route-map RM-TO-TRANSIT out
   neighbor 208.0.1.2 maximum-routes 5000
   neighbor 208.0.2.2 remote-as 65400
   neighbor 208.0.2.2 description peer1-peer
   neighbor 208.0.2.2 send-community
   neighbor 208.0.2.2 route-map RM-FROM-PEER in
   neighbor 208.0.2.2 route-map RM-TO-PEER out
   neighbor 208.0.2.2 maximum-routes 2000
   !
   address-family ipv4
      neighbor IBGP activate
      neighbor 208.0.1.2 activate
      neighbor 208.0.2.2 activate
!
end
