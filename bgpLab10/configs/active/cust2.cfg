! cust2 | bgp-lab10 | external | generated by tools/gen_configs.py
hostname cust2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description EBGP_edge2_AS65100
   no switchport
   ip address 208.0.4.2/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.4.1/32
!
interface Loopback1
   description ORIGINATES_207.0.0.0/16
   ip address 207.0.0.1/16
!
interface Loopback2
   description ORIGINATES_207.0.1.0/24
   ip address 207.0.1.1/24
!
interface Loopback3
   description ORIGINATES_207.0.2.0/24
   ip address 207.0.2.1/24
!
interface Loopback4
   description ANNOUNCES_203.0.0.0/16_ON_PURPOSE
   ip address 203.0.0.1/16
!
interface Loopback5
   description ANNOUNCES_192.168.100.0/24_ON_PURPOSE
   ip address 192.168.100.1/24
!
interface Loopback6
   description ANNOUNCES_169.254.1.0/24_ON_PURPOSE
   ip address 169.254.1.1/24
!
interface Loopback7
   description ANNOUNCED_WITH_AS65100_IN_PATH
   ip address 207.0.9.1/24
!
ip prefix-list PL-LOOPED seq 10 permit 207.0.9.0/24
!
route-map RM-OUT permit 10
   description make this one look like it has transited AS 65100
   match ip address prefix-list PL-LOOPED
   set as-path prepend 65100
!
route-map RM-OUT permit 20
!
ip routing
!
router bgp 65501
   router-id 10.255.4.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor 208.0.4.1 remote-as 65100
   neighbor 208.0.4.1 description edge2
   neighbor 208.0.4.1 send-community
   neighbor 208.0.4.1 maximum-routes 12000
   neighbor 208.0.4.1 route-map RM-OUT out
   network 207.0.0.0/16
   network 207.0.1.0/24
   network 207.0.2.0/24
   network 203.0.0.0/16
   network 192.168.100.0/24
   network 169.254.1.0/24
   network 207.0.9.0/24
   !
   address-family ipv4
      neighbor 208.0.4.1 activate
!
end
