!
route-map RM-FROM-PEER deny 6
   description nobody outside originates our own space
   match ip address prefix-list PL-OURS
!
route-map RM-FROM-PEER permit 10
   set local-preference 150
   set community 65100:150 additive
!
route-map RM-FROM-CUST1 deny 5
