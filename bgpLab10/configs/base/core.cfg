! core | bgp-lab10 | base | generated by tools/gen_configs.py
hostname core
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description IGP_edge1
   no switchport
   mtu 9214
   ip address 10.0.255.0/31
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet2
   description IGP_edge2
   no switchport
   mtu 9214
   ip address 10.0.255.2/31
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet3
   description HOST_h1
   no switchport
   ip address 203.0.48.1/24
!
interface Loopback0
   description ROUTER_ID_AND_IBGP
   ip address 10.0.0.1/32
!
interface Loopback1
   description ORIGINATES_203.0.16.0/20
   ip address 203.0.16.1/20
!
interface Loopback2
   description ORIGINATES_203.0.32.0/20
   ip address 203.0.32.1/20
!
ip routing
!
router ospf 1
   router-id 10.0.0.1
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.0.0.0/22 area 0.0.0.0
   network 10.0.255.0/24 area 0.0.0.0
   network 203.0.48.0/24 area 0.0.0.0
   max-lsa 12000
!
router bgp 65100
   router-id 10.0.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor IBGP peer group
   neighbor IBGP remote-as 65100
   neighbor IBGP update-source Loopback0
   neighbor IBGP send-community
   neighbor IBGP maximum-routes 12000
   neighbor 10.0.0.2 peer group IBGP
   neighbor 10.0.0.2 description edge1
   neighbor 10.0.0.3 peer group IBGP
   neighbor 10.0.0.3 description edge2
   network 203.0.16.0/20
   network 203.0.32.0/20
   network 203.0.48.0/24
   !
   address-family ipv4
      neighbor IBGP activate
!
end
