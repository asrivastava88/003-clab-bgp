! peer1 | bgp-lab10 | external | generated by tools/gen_configs.py
hostname peer1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description EBGP_edge1_AS65100
   no switchport
   ip address 208.0.2.2/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.2.1/32
!
interface Loopback1
   description ORIGINATES_205.0.0.0/16
   ip address 205.0.0.1/16
!
interface Loopback2
   description ANNOUNCES_192.168.50.0/24_ON_PURPOSE
   ip address 192.168.50.1/24
!
ip routing
!
router bgp 65400
   router-id 10.255.2.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor 208.0.2.1 remote-as 65100
   neighbor 208.0.2.1 description edge1
   neighbor 208.0.2.1 send-community
   neighbor 208.0.2.1 maximum-routes 12000
   network 205.0.0.0/16
   network 192.168.50.0/24
   !
   address-family ipv4
      neighbor 208.0.2.1 activate
!
end
