! edge2 | bgp-lab10 | base | generated by tools/gen_configs.py
hostname edge2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description IGP_core
   no switchport
   mtu 9214
   ip address 10.0.255.3/31
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet2
   description IGP_edge1
   no switchport
   mtu 9214
   ip address 10.0.255.5/31
   ip ospf network point-to-point
   ip ospf cost 100
!
interface Ethernet3
   description EBGP_cust1_AS65500_customer
   no switchport
   ip address 208.0.3.1/30
!
interface Ethernet4
   description EBGP_cust2_AS65501_customer
   no switchport
   ip address 208.0.4.1/30
!
interface Loopback0
   description ROUTER_ID_AND_IBGP
   ip address 10.0.0.3/32
!
ip routing
!
router ospf 1
   router-id 10.0.0.3
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   network 10.0.0.0/22 area 0.0.0.0
   network 10.0.255.0/24 area 0.0.0.0
   network 203.0.48.0/24 area 0.0.0.0
   max-lsa 12000
!
router bgp 65100
   router-id 10.0.0.3
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor IBGP peer group
   neighbor IBGP remote-as 65100
   neighbor IBGP update-source Loopback0
   neighbor IBGP send-community
   neighbor IBGP maximum-routes 12000
   neighbor IBGP next-hop-self
   neighbor 10.0.0.1 peer group IBGP
   neighbor 10.0.0.1 description core
   neighbor 10.0.0.2 peer group IBGP
   neighbor 10.0.0.2 description edge1
   neighbor 208.0.3.2 remote-as 65500
   neighbor 208.0.3.2 description cust1-customer
   neighbor 208.0.3.2 send-community
   neighbor 208.0.3.2 maximum-routes 12000
   neighbor 208.0.4.2 remote-as 65501
   neighbor 208.0.4.2 description cust2-customer
   neighbor 208.0.4.2 send-community
   neighbor 208.0.4.2 maximum-routes 12000
   !
   address-family ipv4
      neighbor IBGP activate
      neighbor 208.0.3.2 activate
      neighbor 208.0.4.2 activate
!
end
