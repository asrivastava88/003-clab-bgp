! leaf2 | bgp-lab07 | base | generated by tools/gen_configs.py
hostname leaf2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
vlan 10
   name RED_WEB
!
vlan 30
   name GREEN_WEB
!
vlan 100
   name SVC
!
vrf instance GREEN
!
vrf instance RED
!
vrf instance SHARED
!
interface Ethernet1
   description P2P_spine1
   no switchport
   mtu 9214
   ip address 10.1.1.3/31
!
interface Ethernet2
   description P2P_spine2
   no switchport
   mtu 9214
   ip address 10.1.2.3/31
!
interface Ethernet3
   description HOST_hR2_RED
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Ethernet4
   description HOST_hG1_GREEN
   switchport access vlan 30
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Ethernet5
   description HOST_hS1_SHARED
   switchport access vlan 100
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Loopback0
   description ROUTER_ID_EVPN
   ip address 10.0.0.12/32
!
interface Loopback1
   description VTEP
   ip address 10.0.1.12/32
!
interface Vlan10
   description RED_WEB
   vrf RED
   ip address virtual 10.10.10.1/24
!
interface Vlan30
   description GREEN_WEB
   vrf GREEN
   ip address virtual 10.30.30.1/24
!
interface Vlan100
   description SVC
   vrf SHARED
   ip address virtual 10.100.100.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 30 vni 10030
   vxlan vlan 100 vni 10100
   vxlan vrf GREEN vni 50003
   vxlan vrf RED vni 50001
   vxlan vrf SHARED vni 50099
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf GREEN
ip routing vrf RED
ip routing vrf SHARED
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.0.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65102
   router-id 10.0.0.12
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65100
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN remote-as 65100
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor EVPN maximum-routes 0
   neighbor 10.1.1.2 peer group UNDERLAY
   neighbor 10.1.1.2 description spine1
   neighbor 10.1.2.2 peer group UNDERLAY
   neighbor 10.1.2.2 description spine2
   neighbor 10.0.0.1 peer group EVPN
   neighbor 10.0.0.1 description spine1-evpn
   neighbor 10.0.0.2 peer group EVPN
   neighbor 10.0.0.2 description spine2-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.0.0.12:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 30
      rd 10.0.0.12:10030
      route-target both 10030:10030
      redistribute learned
   !
   vlan 100
      rd 10.0.0.12:10100
      route-target both 10100:10100
      redistribute learned
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
   !
   vrf GREEN
      rd 10.0.0.12:50003
      route-target import evpn 50003:50003
      route-target export evpn 50003:50003
      router-id 10.0.0.12
      maximum-paths 4 ecmp 4
      redistribute connected
   !
   vrf RED
      rd 10.0.0.12:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.0.0.12
      maximum-paths 4 ecmp 4
      redistribute connected
   !
   vrf SHARED
      rd 10.0.0.12:50099
      route-target import evpn 50099:50099
      route-target export evpn 50099:50099
      router-id 10.0.0.12
      maximum-paths 4 ecmp 4
      redistribute connected
   !
!
end
