! fw | bgp-lab07 | fusion-device | generated by tools/gen_configs.py
hostname fw
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description FUSION_bleaf1
   no switchport
!
interface Ethernet1.101
   description FUSION_bleaf1_vrf_RED
   encapsulation dot1q vlan 101
   ip address 172.16.1.2/30
!
interface Ethernet1.102
   description FUSION_bleaf1_vrf_BLUE
   encapsulation dot1q vlan 102
   ip address 172.16.2.2/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.200.1/32
!
ip routing
!
ip prefix-list PL-RED seq 10 permit 10.10.0.0/16 le 24
!
ip prefix-list PL-BLUE seq 10 permit 10.20.0.0/16 le 24
!
route-map RM-FROM-RED permit 10
   match ip address prefix-list PL-RED
!
route-map RM-FROM-BLUE permit 10
   match ip address prefix-list PL-BLUE
!
route-map RM-TO-RED permit 10
   description only BLUE's prefixes go back toward RED
   match ip address prefix-list PL-BLUE
!
route-map RM-TO-BLUE permit 10
   match ip address prefix-list PL-RED
!
router bgp 65200
   router-id 10.255.200.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor 172.16.1.1 remote-as 65104
   neighbor 172.16.1.1 description bleaf1-RED
   neighbor 172.16.1.1 route-map RM-FROM-RED in
   neighbor 172.16.1.1 route-map RM-TO-RED out
   neighbor 172.16.1.1 maximum-routes 1000
   ! the fabric AS appears in the path on the way back, so strip
   ! the private ASNs or bleaf1 drops its own routes as a loop
   neighbor 172.16.1.1 remove-private-as all
   neighbor 172.16.2.1 remote-as 65104
   neighbor 172.16.2.1 description bleaf1-BLUE
   neighbor 172.16.2.1 route-map RM-FROM-BLUE in
   neighbor 172.16.2.1 route-map RM-TO-BLUE out
   neighbor 172.16.2.1 maximum-routes 1000
   ! the fabric AS appears in the path on the way back, so strip
   ! the private ASNs or bleaf1 drops its own routes as a loop
   neighbor 172.16.2.1 remove-private-as all
   !
   address-family ipv4
      neighbor 172.16.1.1 activate
      neighbor 172.16.2.1 activate
!
end
