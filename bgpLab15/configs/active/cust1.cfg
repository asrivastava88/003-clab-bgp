! cust1 | bgp-lab15 | AS 65400 NORTHFIELD, our transit customer, dual stack | generated by tools/gen_configs.py
hostname cust1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description uplink_edge1
   no switchport
   mtu 1500
   ip address 10.5.1.2/30
   ipv6 enable
   ipv6 address 2001:db8:ffff:51::2/64
   ipv6 nd ra suppress all
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.4.1/32
   ipv6 address 2001:db8:ffff:ffff::401/128
!
interface Loopback1
   description SERVICE_HOST
   ip address 198.51.100.1/32
   ipv6 address 2001:db8:40::1/128
!
ip routing
ipv6 unicast-routing
!
ip route 198.51.100.0/24 Null0 254
ipv6 route 2001:db8:40::/48 Null0 254
!
ip prefix-list PL-OWN seq 10 permit 198.51.100.0/24 le 25
!
ipv6 prefix-list PL6-OWN seq 10 permit 2001:db8:40::/48 le 49
!
route-map RM-OWN-ONLY permit 10
   match ip address prefix-list PL-OWN
!
route-map RM-OWN-ONLY6 permit 10
   match ipv6 address prefix-list PL6-OWN
!
router bgp 65400
   router-id 10.255.4.1
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   bgp log-neighbor-changes
   neighbor 10.5.1.1 remote-as 65010
   neighbor 10.5.1.1 description edge1_v4
   neighbor 10.5.1.1 send-community
   neighbor 10.5.1.1 maximum-routes 12000
   neighbor 2001:db8:ffff:51::1 remote-as 65010
   neighbor 2001:db8:ffff:51::1 description edge1_v6
   neighbor 2001:db8:ffff:51::1 send-community
   neighbor 2001:db8:ffff:51::1 maximum-routes 12000
   !
   address-family ipv4
      neighbor 10.5.1.1 activate
      neighbor 10.5.1.1 route-map RM-OWN-ONLY out
      network 198.51.100.0/24
   !
   address-family ipv6
      neighbor 2001:db8:ffff:51::1 activate
      neighbor 2001:db8:ffff:51::1 route-map RM-OWN-ONLY6 out
      network 2001:db8:40::/48
!
end
