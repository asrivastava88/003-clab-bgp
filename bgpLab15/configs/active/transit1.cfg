! transit1 | bgp-lab15 | AS 65100 PACRIM, primary transit, dual stack | generated by tools/gen_configs.py
hostname transit1
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description to_edge1
   no switchport
   mtu 1500
   ip address 10.1.1.2/30
   ipv6 enable
   ipv6 address 2001:db8:ffff:11::2/64
   ipv6 nd ra suppress all
!
interface Ethernet2
   description to_edge2
   no switchport
   mtu 1500
   ip address 10.1.2.2/30
   ipv6 enable
   ipv6 address 2001:db8:ffff:12::2/64
   ipv6 nd ra suppress all
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.1.1/32
   ipv6 address 2001:db8:ffff:ffff::101/128
!
interface Loopback1
   description SERVICE_HOST
   ip address 100.100.0.1/32
   ipv6 address 2001:db8:100::1/128
!
interface Loopback2
   description SERVICE_HOST
   ip address 100.200.0.1/32
   ipv6 address 2001:db8:200::1/128
!
ip routing
ipv6 unicast-routing
!
ip route 100.100.0.0/16 Null0 254
ip route 100.200.0.0/16 Null0 254
ip route 198.18.1.0/24 Null0 254
ipv6 route 2001:db8:100::/48 Null0 254
ipv6 route 2001:db8:200::/48 Null0 254
ipv6 route 2001:db8:18::/48 Null0 254
!
ip prefix-list PL-OWN seq 10 permit 100.100.0.0/16 le 25
ip prefix-list PL-OWN seq 20 permit 100.200.0.0/16 le 25
ip prefix-list PL-OWN seq 30 permit 198.18.1.0/24 le 25
!
ipv6 prefix-list PL6-OWN seq 10 permit 2001:db8:100::/48 le 49
ipv6 prefix-list PL6-OWN seq 20 permit 2001:db8:200::/48 le 49
ipv6 prefix-list PL6-OWN seq 30 permit 2001:db8:18::/48 le 49
!
route-map RM-OWN-ONLY permit 10
   match ip address prefix-list PL-OWN
!
route-map RM-OWN-ONLY6 permit 10
   match ipv6 address prefix-list PL6-OWN
!
router bgp 65100
   router-id 10.255.1.1
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   bgp log-neighbor-changes
   neighbor 10.1.1.1 remote-as 65010
   neighbor 10.1.1.1 description edge1_v4
   neighbor 10.1.1.1 send-community
   neighbor 10.1.1.1 maximum-routes 12000
   neighbor 2001:db8:ffff:11::1 remote-as 65010
   neighbor 2001:db8:ffff:11::1 description edge1_v6
   neighbor 2001:db8:ffff:11::1 send-community
   neighbor 2001:db8:ffff:11::1 maximum-routes 12000
   neighbor 10.1.2.1 remote-as 65010
   neighbor 10.1.2.1 description edge2_v4
   neighbor 10.1.2.1 send-community
   neighbor 10.1.2.1 maximum-routes 12000
   neighbor 2001:db8:ffff:12::1 remote-as 65010
   neighbor 2001:db8:ffff:12::1 description edge2_v6
   neighbor 2001:db8:ffff:12::1 send-community
   neighbor 2001:db8:ffff:12::1 maximum-routes 12000
   !
   address-family ipv4
      neighbor 10.1.1.1 activate
      neighbor 10.1.1.1 route-map RM-OWN-ONLY out
      neighbor 10.1.2.1 activate
      neighbor 10.1.2.1 route-map RM-OWN-ONLY out
      network 100.100.0.0/16
      network 100.200.0.0/16
      network 198.18.1.0/24
   !
   address-family ipv6
      neighbor 2001:db8:ffff:11::1 activate
      neighbor 2001:db8:ffff:11::1 route-map RM-OWN-ONLY6 out
      neighbor 2001:db8:ffff:12::1 activate
      neighbor 2001:db8:ffff:12::1 route-map RM-OWN-ONLY6 out
      network 2001:db8:100::/48
      network 2001:db8:200::/48
      network 2001:db8:18::/48
!
end
