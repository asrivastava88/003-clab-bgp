! inet | bgp-lab02 | provider-managed | generated by tools/gen_configs.py
hostname inet
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description UPSTREAM_ispA
   no switchport
   ip address 100.64.1.2/30
!
interface Ethernet2
   description UPSTREAM_ispB
   no switchport
   ip address 100.64.2.2/30
!
interface Loopback0
   description ROUTER_ID
   ip address 100.64.0.1/32
!
interface Loopback1
   description internet test target
   ip address 203.0.113.10/32
!
ip routing
!
! pull 203.0.113.0/24 into the table so BGP can originate it
ip route 203.0.113.0/24 Null0
!
router bgp 65000
   router-id 100.64.0.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor 100.64.1.1 remote-as 65010
   neighbor 100.64.1.1 description ispA
   neighbor 100.64.1.1 send-community
   neighbor 100.64.1.1 maximum-routes 12000
   neighbor 100.64.2.1 remote-as 65020
   neighbor 100.64.2.1 description ispB
   neighbor 100.64.2.1 send-community
   neighbor 100.64.2.1 maximum-routes 12000
   network 203.0.113.0/24
   !
   address-family ipv4
      neighbor 100.64.1.1 activate
      neighbor 100.64.2.1 activate
!
end
