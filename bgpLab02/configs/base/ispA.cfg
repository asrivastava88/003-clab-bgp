! ispA | bgp-lab02 | provider-managed | generated by tools/gen_configs.py
hostname ispA
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description CUST_bleaf1
   no switchport
!
interface Ethernet2
   description CUST_bleaf2
   no switchport
!
interface Ethernet1.101
   description CUST_bleaf1_RED
   encapsulation dot1q vlan 101
   ip address 172.16.11.2/30
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet1.102
   description CUST_bleaf1_BLUE
   encapsulation dot1q vlan 102
   ip address 172.16.11.6/30
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet2.101
   description CUST_bleaf2_RED
   encapsulation dot1q vlan 101
   ip address 172.16.12.2/30
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet2.102
   description CUST_bleaf2_BLUE
   encapsulation dot1q vlan 102
   ip address 172.16.12.6/30
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet3
   description UPSTREAM_inet
   no switchport
   ip address 100.64.1.1/30
!
interface Loopback0
   ip address 10.255.1.1/32
!
interface Loopback1
   description other-customer test address
   ip address 192.0.2.1/32
!
ip routing
!
ip route 192.0.2.0/24 Null0
ip route 192.0.2.254/32 Null0
!
ip prefix-list PL-TO-CUST seq 10 permit 0.0.0.0/0
ip prefix-list PL-TO-CUST seq 20 permit 192.0.2.0/24
ip prefix-list PL-TO-CUST seq 30 permit 198.51.100.0/24
ip prefix-list PL-TO-CUST seq 40 permit 203.0.113.0/24
ip prefix-list PL-CUST seq 10 permit 10.10.0.0/16 le 24
ip prefix-list PL-CUST seq 20 permit 10.30.0.0/16 le 24
ip prefix-list PL-CUST-HOST seq 10 permit 10.10.0.0/16 ge 32
ip prefix-list PL-CUST-HOST seq 20 permit 10.30.0.0/16 ge 32
!
ip community-list CL-BLACKHOLE permit 65010:666
ip community-list CL-LP80 permit 65010:80
ip community-list CL-PREPEND3 permit 65010:903
!
route-map RM-CUST-IN permit 10
   description RTBH: /32 + 65010:666 -> discard, never exported
   match community CL-BLACKHOLE
   match ip address prefix-list PL-CUST-HOST
   set ip next-hop 192.0.2.254
   set community no-export additive
!
route-map RM-CUST-IN permit 20
   description customer-signalled backup
   match community CL-LP80
   match ip address prefix-list PL-CUST
   set local-preference 80
!
route-map RM-CUST-IN permit 30
   match ip address prefix-list PL-CUST
   set local-preference 200
!
route-map RM-CUST-OUT permit 10
   match ip address prefix-list PL-TO-CUST
!
route-map RM-INET-IN permit 10
   set local-preference 100
!
route-map RM-INET-OUT permit 10
   match community CL-PREPEND3
   set as-path prepend 65010 65010 65010
!
route-map RM-INET-OUT permit 20
!
router bgp 65010
   router-id 10.255.1.1
   maximum-paths 4 ecmp 4
   neighbor CUSTOMER peer group
   neighbor CUSTOMER remote-as 65104
   neighbor CUSTOMER route-map RM-CUST-IN in
   neighbor CUSTOMER route-map RM-CUST-OUT out
   neighbor CUSTOMER default-originate
   neighbor CUSTOMER bfd
   neighbor CUSTOMER maximum-routes 100
   neighbor 172.16.11.1 peer group CUSTOMER
   neighbor 172.16.11.1 description bleaf1-RED
   neighbor 172.16.11.5 peer group CUSTOMER
   neighbor 172.16.11.5 description bleaf1-BLUE
   neighbor 172.16.12.1 peer group CUSTOMER
   neighbor 172.16.12.1 description bleaf2-RED
   neighbor 172.16.12.5 peer group CUSTOMER
   neighbor 172.16.12.5 description bleaf2-BLUE
   neighbor 100.64.1.2 remote-as 65000
   neighbor 100.64.1.2 description inet
   neighbor 100.64.1.2 route-map RM-INET-IN in
   neighbor 100.64.1.2 route-map RM-INET-OUT out
   network 192.0.2.0/24
!
end
