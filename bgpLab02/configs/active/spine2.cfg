! spine2 | bgp-lab02 | te | generated by tools/gen_configs.py
hostname spine2
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode mstp
!
interface Ethernet1
   description P2P_leaf1
   no switchport
   mtu 9214
   ip address 10.1.2.0/31
!
interface Ethernet2
   description P2P_leaf2
   no switchport
   mtu 9214
   ip address 10.1.2.2/31
!
interface Ethernet3
   description P2P_bleaf1
   no switchport
   mtu 9214
   ip address 10.1.2.4/31
!
interface Ethernet4
   description P2P_bleaf2
   no switchport
   mtu 9214
   ip address 10.1.2.6/31
!
interface Loopback0
   ip address 10.0.0.2/32
!
ip routing
!
ip prefix-list PL-LOOPBACKS seq 10 permit 10.0.0.0/24 eq 32
ip prefix-list PL-LOOPBACKS seq 20 permit 10.0.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65100
   router-id 10.0.0.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   distance bgp 20 200 200
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN next-hop-unchanged
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community
   neighbor EVPN maximum-routes 0
   neighbor 10.1.2.1 peer group UNDERLAY
   neighbor 10.1.2.1 remote-as 65101
   neighbor 10.1.2.1 description leaf1
   neighbor 10.1.2.3 peer group UNDERLAY
   neighbor 10.1.2.3 remote-as 65102
   neighbor 10.1.2.3 description leaf2
   neighbor 10.1.2.5 peer group UNDERLAY
   neighbor 10.1.2.5 remote-as 65104
   neighbor 10.1.2.5 description bleaf1
   neighbor 10.1.2.7 peer group UNDERLAY
   neighbor 10.1.2.7 remote-as 65104
   neighbor 10.1.2.7 description bleaf2
   neighbor 10.0.0.11 peer group EVPN
   neighbor 10.0.0.11 remote-as 65101
   neighbor 10.0.0.11 description leaf1-evpn
   neighbor 10.0.0.12 peer group EVPN
   neighbor 10.0.0.12 remote-as 65102
   neighbor 10.0.0.12 description leaf2-evpn
   neighbor 10.0.0.14 peer group EVPN
   neighbor 10.0.0.14 remote-as 65104
   neighbor 10.0.0.14 description bleaf1-evpn
   neighbor 10.0.0.15 peer group EVPN
   neighbor 10.0.0.15 remote-as 65104
   neighbor 10.0.0.15 description bleaf2-evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
!
end
