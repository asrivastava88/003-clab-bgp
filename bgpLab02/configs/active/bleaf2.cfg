      neighbor 172.16.12.2 route-map RM-RED-ISPA-OUT out
      neighbor 172.16.12.2 maximum-routes 1000
      neighbor 172.16.12.2 send-community
      neighbor 172.16.12.2 bfd
      neighbor 172.16.22.2 remote-as 65020
      neighbor 172.16.22.2 description ispB
      neighbor 172.16.22.2 route-map RM-RED-ISPB-IN in
      neighbor 172.16.22.2 route-map RM-RED-ISPB-OUT out
      neighbor 172.16.22.2 maximum-routes 1000
