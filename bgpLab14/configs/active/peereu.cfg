! peereu | bgp-lab14 | AS 65400 MERIDIAN EU, peers at London, transit customer of 65100 | generated by tools/gen_configs.py
hostname peereu
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description PEER_lhr
   no switchport
   mtu 1500
   ip address 10.160.1.2/30
!
interface Ethernet2
   description TRANSIT_gtte
   no switchport
   mtu 1500
   ip address 10.160.2.2/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.4.1/32
!
interface Loopback1
   description SERVICE_HOST
   ip address 100.140.0.1/32
!
ip routing
!
ip route 100.140.0.0/16 Null0 254
!
ip prefix-list PL-OWN seq 10 permit 100.140.0.0/16 le 24
!
route-map RM-OWN-ONLY permit 10
   match ip address prefix-list PL-OWN
   set metric 0
!
router bgp 65400
   router-id 10.255.4.1
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   bgp log-neighbor-changes
   neighbor 10.160.1.1 remote-as 65010
   neighbor 10.160.1.1 description lhr_peering
   neighbor 10.160.1.1 send-community
   neighbor 10.160.1.1 route-map RM-OWN-ONLY out
   neighbor 10.160.1.1 maximum-routes 12000
   neighbor 10.160.2.1 remote-as 65100
   neighbor 10.160.2.1 description gtte_transit
   neighbor 10.160.2.1 send-community
   neighbor 10.160.2.1 route-map RM-OWN-ONLY out
   neighbor 10.160.2.1 maximum-routes 12000
   network 100.140.0.0/16
   !
   address-family ipv4
      neighbor 10.160.1.1 activate
      neighbor 10.160.2.1 activate
!
end
