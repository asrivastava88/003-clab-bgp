! ash | bgp-lab14 | AS 65010 PoP, ash | generated by tools/gen_configs.py
hostname ash
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description HANDOFF_gtte_Ashburn
   no switchport
   mtu 1500
   ip address 10.100.3.1/30
!
interface Ethernet2
   description BACKBONE_sea_65ms
   no switchport
   mtu 9100
   ip address 10.254.0.1/31
   ip ospf cost 65
!
interface Ethernet3
   description BACKBONE_lhr_75ms
   no switchport
   mtu 9100
   ip address 10.254.0.2/31
   ip ospf cost 75
!
interface Loopback0
   description ROUTER_ID / iBGP SOURCE
   ip address 10.255.0.2/32
!
interface Loopback1
   description ANYCAST_SERVICE
   ip address 192.0.2.1/32
!
ip routing
!
ip route 192.0.2.0/24 Null0 254
!
ip prefix-list PL-ANYCAST seq 10 permit 192.0.2.0/24
!
ip prefix-list PL-AMER seq 10 permit 198.51.100.0/24
!
ip prefix-list PL-EMEA seq 10 permit 203.0.113.0/24
!
ip prefix-list PL-APAC seq 10 permit 198.18.0.0/24
!
ip prefix-list PL-REGIONAL seq 10 permit 198.18.1.0/24
!
ip prefix-list PL-OUR-ALL seq 10 permit 192.0.2.0/24 le 32
ip prefix-list PL-OUR-ALL seq 20 permit 198.51.100.0/24 le 32
ip prefix-list PL-OUR-ALL seq 30 permit 203.0.113.0/24 le 32
ip prefix-list PL-OUR-ALL seq 40 permit 198.18.0.0/24 le 32
ip prefix-list PL-OUR-ALL seq 50 permit 198.18.1.0/24 le 32
!
ip prefix-list PL-CDN seq 10 permit 100.120.0.0/16 le 24
!
ip prefix-list PL-PEEREU seq 10 permit 100.140.0.0/16 le 24
!
ip prefix-list PL-BOGON seq 10 deny 0.0.0.0/0
ip prefix-list PL-BOGON seq 20 deny 0.0.0.0/8 le 32
ip prefix-list PL-BOGON seq 30 deny 10.0.0.0/8 le 32
ip prefix-list PL-BOGON seq 40 deny 127.0.0.0/8 le 32
ip prefix-list PL-BOGON seq 50 deny 169.254.0.0/16 le 32
ip prefix-list PL-BOGON seq 60 deny 172.16.0.0/12 le 32
ip prefix-list PL-BOGON seq 70 deny 192.168.0.0/16 le 32
ip prefix-list PL-BOGON seq 80 deny 224.0.0.0/4 le 32
ip prefix-list PL-BOGON seq 90 deny 240.0.0.0/4 le 32
ip prefix-list PL-BOGON seq 100 permit 0.0.0.0/0 ge 8 le 24
!
route-map RM-GTT-OUT permit 10
   match ip address prefix-list PL-ANYCAST
   set metric 0
!
route-map RM-GTT-OUT permit 20
   match ip address prefix-list PL-AMER
   set metric 65
!
route-map RM-GTT-OUT permit 30
   match ip address prefix-list PL-EMEA
   set metric 75
!
route-map RM-GTT-OUT permit 40
   match ip address prefix-list PL-APAC
   set metric 235
!
route-map RM-EXT-OUT permit 10
   match ip address prefix-list PL-ANYCAST
   set metric 0
!
route-map RM-EXT-OUT permit 20
   match ip address prefix-list PL-AMER
   set metric 65
!
route-map RM-EXT-OUT permit 30
   match ip address prefix-list PL-EMEA
   set metric 75
!
route-map RM-EXT-OUT permit 40
   match ip address prefix-list PL-APAC
   set metric 235
!
route-map RM-GTT-IN deny 5
   description never accept our own space from anyone
   match ip address prefix-list PL-OUR-ALL
!
route-map RM-GTT-IN permit 10
   description MED preserved on purpose: that is the cold-potato decision
   match ip address prefix-list PL-BOGON
   set local-preference 100
!
router ospf 1
   router-id 10.255.0.2
   network 10.255.0.2/32 area 0.0.0.0
   network 10.254.0.0/31 area 0.0.0.0
   network 10.254.0.2/31 area 0.0.0.0
   max-lsa 12000
!
router bgp 65010
   router-id 10.255.0.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 2 ecmp 2
   bgp log-neighbor-changes
   neighbor IBGP peer group
   neighbor IBGP remote-as 65010
   neighbor IBGP update-source Loopback0
   neighbor IBGP next-hop-self
   neighbor IBGP send-community
   neighbor IBGP maximum-routes 12000
   neighbor 10.255.0.1 peer group IBGP
   neighbor 10.255.0.1 description sea
   neighbor 10.255.0.3 peer group IBGP
   neighbor 10.255.0.3 description lhr
   neighbor 10.255.0.4 peer group IBGP
   neighbor 10.255.0.4 description sin
   neighbor GTT peer group
   neighbor GTT remote-as 65100
   neighbor GTT send-community
   neighbor GTT route-map RM-GTT-IN in
   neighbor GTT route-map RM-GTT-OUT out
   neighbor GTT maximum-routes 12000
   neighbor 10.100.3.2 peer group GTT
   neighbor 10.100.3.2 description global transit
   network 192.0.2.0/24
   !
   address-family ipv4
      neighbor IBGP activate
      neighbor GTT activate
!
end
