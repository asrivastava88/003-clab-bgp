! gttw | bgp-lab14 | AS 65100 global transit, west | generated
hostname gttw
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description HANDOFF_sea
   no switchport
   mtu 1500
   ip address 10.100.1.2/30
!
interface Ethernet2
   description HANDOFF_sin
   no switchport
   mtu 1500
   ip address 10.100.2.2/30
!
interface Ethernet3
   description INTERNAL_gtte_70ms
   no switchport
   mtu 9100
   ip address 10.110.0.1/30
   ip ospf cost 70
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.1.1/32
!
interface Loopback1
   description CUSTOMER_HOST
   ip address 100.150.0.1/32
!
interface Loopback2
   description CUSTOMER_HOST
   ip address 100.151.0.1/32
!
interface Loopback3
   description CUSTOMER_HOST
   ip address 100.200.0.1/32
!
ip routing
!
ip route 100.150.0.0/16 Null0 254
ip route 100.151.0.0/16 Null0 254
ip route 100.152.0.0/16 Null0 254
ip route 100.153.0.0/16 Null0 254
ip route 100.200.0.0/16 Null0 254
!
ip prefix-list PL-C-150-0 seq 10 permit 100.150.0.0/16 le 24
!
ip prefix-list PL-C-151-0 seq 10 permit 100.151.0.0/16 le 24
!
ip prefix-list PL-C-152-0 seq 10 permit 100.152.0.0/16 le 24
!
ip prefix-list PL-C-153-0 seq 10 permit 100.153.0.0/16 le 24
!
ip prefix-list PL-C-200-0 seq 10 permit 100.200.0.0/16 le 24
!
ip prefix-list PL-PEEREU seq 10 permit 100.140.0.0/16 le 24
!
ip prefix-list PL-OWN-ALL seq 10 permit 100.150.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 20 permit 100.151.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 30 permit 100.152.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 40 permit 100.153.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 50 permit 100.200.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 60 permit 100.140.0.0/16 le 24
!
route-map RM-OUT-SEA permit 10
   description APAC eyeballs: 175ms of our backbone from sea
   match ip address prefix-list PL-C-150-0
   set metric 175
!
route-map RM-OUT-SEA permit 20
   description Americas west eyeballs: 0ms of our backbone from sea
   match ip address prefix-list PL-C-151-0
   set metric 0
!
route-map RM-OUT-SEA permit 30
   description Americas east eyeballs: 65ms of our backbone from sea
   match ip address prefix-list PL-C-152-0
   set metric 65
!
route-map RM-OUT-SEA permit 40
   description Europe eyeballs: 140ms of our backbone from sea
   match ip address prefix-list PL-C-153-0
   set metric 140
!
route-map RM-OUT-SEA permit 50
   description transit-only destination, everywhere: 0ms of our backbone from sea
   match ip address prefix-list PL-C-200-0
   set metric 0
!
route-map RM-OUT-SEA permit 60
   description european customer, homed at London
   match ip address prefix-list PL-PEEREU
   set metric 140
!
route-map RM-OUT-SIN permit 10
   description APAC eyeballs: 0ms of our backbone from sin
   match ip address prefix-list PL-C-150-0
   set metric 0
!
route-map RM-OUT-SIN permit 20
   description Americas west eyeballs: 175ms of our backbone from sin
   match ip address prefix-list PL-C-151-0
   set metric 175
!
route-map RM-OUT-SIN permit 30
   description Americas east eyeballs: 235ms of our backbone from sin
   match ip address prefix-list PL-C-152-0
   set metric 235
!
route-map RM-OUT-SIN permit 40
   description Europe eyeballs: 160ms of our backbone from sin
   match ip address prefix-list PL-C-153-0
   set metric 160
!
route-map RM-OUT-SIN permit 50
   description transit-only destination, everywhere: 0ms of our backbone from sin
   match ip address prefix-list PL-C-200-0
   set metric 0
!
route-map RM-OUT-SIN permit 60
   description european customer, homed at London
   match ip address prefix-list PL-PEEREU
   set metric 160
!
route-map RM-OWN-ONLY permit 10
   match ip address prefix-list PL-OWN-ALL
!
router ospf 1
   router-id 10.255.1.1
   network 10.255.1.1/32 area 0.0.0.0
   network 10.110.0.0/30 area 0.0.0.0
   max-lsa 12000
!
router bgp 65100
   router-id 10.255.1.1
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   bgp log-neighbor-changes
   neighbor 10.255.1.2 remote-as 65100
   neighbor 10.255.1.2 update-source Loopback0
   neighbor 10.255.1.2 next-hop-self
   neighbor 10.255.1.2 send-community
   neighbor 10.255.1.2 maximum-routes 12000
   neighbor 10.100.1.1 remote-as 65010
   neighbor 10.100.1.1 description sea
   neighbor 10.100.1.1 send-community
   neighbor 10.100.1.1 route-map RM-OUT-SEA out
   neighbor 10.100.1.1 maximum-routes 12000
   neighbor 10.100.2.1 remote-as 65010
   neighbor 10.100.2.1 description sin
   neighbor 10.100.2.1 send-community
   neighbor 10.100.2.1 route-map RM-OUT-SIN out
   neighbor 10.100.2.1 maximum-routes 12000
   network 100.150.0.0/16
   network 100.151.0.0/16
   network 100.152.0.0/16
   network 100.153.0.0/16
   network 100.200.0.0/16
   !
   address-family ipv4
      neighbor 10.255.1.2 activate
      neighbor 10.100.1.1 activate
      neighbor 10.100.2.1 activate
!
end
