! gtte | bgp-lab14 | AS 65100 global transit, east | generated
hostname gtte
!
service routing protocols model multi-agent
!
no aaa root
username admin privilege 15 role network-admin secret 0 admin
!
spanning-tree mode none
!
interface Ethernet1
   description HANDOFF_ash
   no switchport
   mtu 1500
   ip address 10.100.3.2/30
!
interface Ethernet2
   description HANDOFF_lhr
   no switchport
   mtu 1500
   ip address 10.100.4.2/30
!
interface Ethernet3
   description INTERNAL_gttw_70ms
   no switchport
   mtu 9100
   ip address 10.110.0.2/30
   ip ospf cost 70
!
interface Ethernet4
   description CUSTOMER_peereu
   no switchport
   mtu 1500
   ip address 10.160.2.1/30
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.1.2/32
!
interface Loopback1
   description CUSTOMER_HOST
   ip address 100.152.0.1/32
!
interface Loopback2
   description CUSTOMER_HOST
   ip address 100.153.0.1/32
!
interface Loopback3
   description CUSTOMER_HOST
   ip address 100.200.0.1/32
!
ip routing
!
ip route 100.150.0.0/16 Null0 254
ip route 100.151.0.0/16 Null0 254
ip route 100.152.0.0/16 Null0 254
ip route 100.153.0.0/16 Null0 254
ip route 100.200.0.0/16 Null0 254
!
ip prefix-list PL-C-150-0 seq 10 permit 100.150.0.0/16 le 24
!
ip prefix-list PL-C-151-0 seq 10 permit 100.151.0.0/16 le 24
!
ip prefix-list PL-C-152-0 seq 10 permit 100.152.0.0/16 le 24
!
ip prefix-list PL-C-153-0 seq 10 permit 100.153.0.0/16 le 24
!
ip prefix-list PL-C-200-0 seq 10 permit 100.200.0.0/16 le 24
!
ip prefix-list PL-PEEREU seq 10 permit 100.140.0.0/16 le 24
!
ip prefix-list PL-OWN-ALL seq 10 permit 100.150.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 20 permit 100.151.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 30 permit 100.152.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 40 permit 100.153.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 50 permit 100.200.0.0/16 le 24
ip prefix-list PL-OWN-ALL seq 60 permit 100.140.0.0/16 le 24
!
route-map RM-OUT-ASH permit 10
   description APAC eyeballs: 235ms of our backbone from ash
   match ip address prefix-list PL-C-150-0
   set metric 235
!
route-map RM-OUT-ASH permit 20
   description Americas west eyeballs: 65ms of our backbone from ash
   match ip address prefix-list PL-C-151-0
   set metric 65
!
route-map RM-OUT-ASH permit 30
   description Americas east eyeballs: 0ms of our backbone from ash
   match ip address prefix-list PL-C-152-0
   set metric 0
!
route-map RM-OUT-ASH permit 40
   description Europe eyeballs: 75ms of our backbone from ash
   match ip address prefix-list PL-C-153-0
   set metric 75
!
route-map RM-OUT-ASH permit 50
   description transit-only destination, everywhere: 0ms of our backbone from ash
   match ip address prefix-list PL-C-200-0
   set metric 0
!
route-map RM-OUT-ASH permit 60
   description european customer, homed at London
   match ip address prefix-list PL-PEEREU
   set metric 75
!
route-map RM-OUT-LHR permit 10
   description APAC eyeballs: 160ms of our backbone from lhr
   match ip address prefix-list PL-C-150-0
   set metric 160
!
route-map RM-OUT-LHR permit 20
   description Americas west eyeballs: 140ms of our backbone from lhr
   match ip address prefix-list PL-C-151-0
   set metric 140
!
route-map RM-OUT-LHR permit 30
   description Americas east eyeballs: 75ms of our backbone from lhr
   match ip address prefix-list PL-C-152-0
   set metric 75
!
route-map RM-OUT-LHR permit 40
   description Europe eyeballs: 0ms of our backbone from lhr
   match ip address prefix-list PL-C-153-0
   set metric 0
!
route-map RM-OUT-LHR permit 50
   description transit-only destination, everywhere: 0ms of our backbone from lhr
   match ip address prefix-list PL-C-200-0
   set metric 0
!
route-map RM-OUT-LHR permit 60
   description european customer, homed at London
   match ip address prefix-list PL-PEEREU
   set metric 0
!
route-map RM-OWN-ONLY permit 10
   match ip address prefix-list PL-OWN-ALL
!
router ospf 1
   router-id 10.255.1.2
   network 10.255.1.2/32 area 0.0.0.0
   network 10.110.0.0/30 area 0.0.0.0
   max-lsa 12000
!
router bgp 65100
   router-id 10.255.1.2
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   bgp log-neighbor-changes
   neighbor 10.255.1.1 remote-as 65100
   neighbor 10.255.1.1 update-source Loopback0
   neighbor 10.255.1.1 next-hop-self
   neighbor 10.255.1.1 send-community
   neighbor 10.255.1.1 maximum-routes 12000
   neighbor 10.100.3.1 remote-as 65010
   neighbor 10.100.3.1 description ash
   neighbor 10.100.3.1 send-community
   neighbor 10.100.3.1 route-map RM-OUT-ASH out
   neighbor 10.100.3.1 maximum-routes 12000
   neighbor 10.100.4.1 remote-as 65010
   neighbor 10.100.4.1 description lhr
   neighbor 10.100.4.1 send-community
   neighbor 10.100.4.1 route-map RM-OUT-LHR out
   neighbor 10.100.4.1 maximum-routes 12000
   neighbor 10.160.2.2 remote-as 65400
   neighbor 10.160.2.2 description peereu_customer
   neighbor 10.160.2.2 send-community
   neighbor 10.160.2.2 maximum-routes 500
   network 100.150.0.0/16
   network 100.151.0.0/16
   network 100.152.0.0/16
   network 100.153.0.0/16
   network 100.200.0.0/16
   !
   address-family ipv4
      neighbor 10.255.1.1 activate
      neighbor 10.100.3.1 activate
      neighbor 10.100.4.1 activate
      neighbor 10.160.2.2 activate
!
end
